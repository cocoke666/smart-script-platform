<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的（创作者） · 智能剧本创作平台原型</title>
<link rel="stylesheet" href="css/app.css?v=7">
<style>
/* ---------- 我的页专属样式 ---------- */
.cardbox { margin: 12px 16px; border: none; border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow-card); padding: 14px; }
.cardbox h3 { font-size: 14px; margin-bottom: 8px; color: var(--text-1); }
.prof-head { display: flex; gap: 12px; align-items: center; }
.prof-head .ava { width: 56px; height: 56px; border-radius: 50%; background: var(--primary-tint); border: none; color: var(--primary); flex: none; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; }
.prof-head .who { flex: 1; }
.prof-head .who .row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.prof-head .who b { font-size: 16px; }
.prof-head .who .bio { font-size: 12px; color: var(--text-3); }
.auth-btn { border: none; background: var(--primary-tint); color: var(--primary); font-weight: 500; border-radius: 12px; padding: 5px 12px; font-size: 11px; cursor: pointer; flex: none; }
.auth-btn.on { background: var(--primary); color: #fff; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; padding-bottom: 2px; }
.quick button { flex: none; width: calc(25% - 6px); border: none; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); padding-top: 12px; }
.quick .qicon { width: 42px; height: 42px; border-radius: 50%; background: var(--primary-tint); border: none; color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 17px; }
.quick .qicon svg { width: 20px; height: 20px; }
/* 我的书架：竖版书封，一行三本 */
.shelf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; padding-top: 4px; }
.book { border: none; background: none; cursor: pointer; padding: 0; text-align: center; display: block; }
.book .cv { position: relative; display: flex; align-items: center; justify-content: center; aspect-ratio: 3 / 4; border-radius: 8px; color: #fff; box-shadow: var(--shadow-card); overflow: hidden; }
.book .cv.g1 { background: linear-gradient(160deg, #2F5FA8, #1B3A6B); }
.book .cv.g2 { background: linear-gradient(160deg, #254E90, #16305C); }
.book .cv.g3 { background: linear-gradient(160deg, #4A76B8, #2A4C86); }
.book .cv::before { content: ''; position: absolute; left: 7px; top: 0; bottom: 0; width: 1px; background: rgba(255, 255, 255, .35); }
.book .cv .score { position: absolute; right: 5px; bottom: 5px; font-size: 10px; background: rgba(0, 0, 0, .28); border-radius: 8px; padding: 1px 6px; }
.book .nm { display: block; font-size: 12px; color: var(--text-1); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.book .au { display: block; font-size: 11px; color: var(--text-3); }
.wchips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 6px; scrollbar-width: none; }
.wchips::-webkit-scrollbar { display: none; }
.witem { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--divider); }
.witem:last-child { border-bottom: none; }
.witem .l b { font-size: 14px; display: block; margin-bottom: 2px; color: var(--text-1); }
.witem .l span { font-size: 11px; color: var(--text-3); }
.entry { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--divider); font-size: 14px; cursor: pointer; }
.entry:last-child { border-bottom: none; }
.entry .ar { color: #C9CDD4; }
.entry .num { color: var(--text-3); font-size: 12px; margin-right: 6px; }
/* 弹层内通用 */
.fld { margin-bottom: 10px; }
.fld label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
.fld input, .fld textarea, .fld select { width: 100%; border: 1px solid var(--divider); border-radius: 8px; padding: 8px 10px; font-size: 13px; background: var(--card); color: var(--text-1); font-family: inherit; outline: none; }
.fld input:focus, .fld textarea:focus { border-color: var(--primary); }
.file-box { border: 1.5px dashed #C9CDD4; border-radius: 10px; padding: 18px 12px; text-align: center; color: var(--text-3); font-size: 12px; cursor: pointer; background: var(--fill); }
.file-box.on { border-color: var(--primary); color: var(--primary); background: var(--primary-tint); font-weight: 600; }
.id-up { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.id-up .file-box { padding: 18px 8px; line-height: 1.5; }
.id-up .ph { display: block; font-size: 20px; line-height: 1; margin-bottom: 6px; color: var(--text-3); }
.id-up .file-box.on .ph { color: var(--primary); }
.up-tip { font-size: 11px; color: var(--text-3); margin-top: 8px; line-height: 1.6; }
/* 我的印章 */
.seal-box { width: 148px; aspect-ratio: 1; margin: 6px auto 0; border: 1.5px dashed #C9CDD4; border-radius: 12px; background: var(--fill); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--text-3); font-size: 12px; cursor: pointer; }
.seal-box .seal-plus { font-size: 26px; line-height: 1; }
.seal-box.on { border: none; background: var(--card); }
.seal-img { width: 112px; aspect-ratio: 1; border: 3px solid #D0342C; border-radius: 50%; box-shadow: inset 0 0 0 1.5px #D0342C; color: #D0342C; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; letter-spacing: 1px; }
.seal-ops { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
.seal-ops .btn-outline { height: 32px; border-radius: 8px; font-size: 12px; }
.seal-ops .del { background: var(--fill); color: var(--text-3); }
/* 我的剧本：矮版行式卡片 */
.brow.sm { padding: 10px; gap: 10px; margin-bottom: 8px; }
.brow.sm .cv { width: 60px; border-radius: 6px; }
.brow.sm .cv .vt { font-size: 11px; letter-spacing: 1px; }
.brow.sm .cv .score { font-size: 10px; left: 4px; bottom: 4px; padding: 0 4px; }
.brow.sm .bd h4 { font-size: 15px; margin-bottom: 4px; }
.brow.sm .bd .au { font-size: 12px; -webkit-line-clamp: 1; margin-bottom: 6px; }
.brow.sm .meta { gap: 6px; }
.brow.sm .meta span { font-size: 11px; padding: 3px 8px; }
.brow.sm .ops { margin-top: 6px; }
.brow.sm .ops button { height: 26px; padding: 0 10px; font-size: 11px; }
/* 编辑弹层标签编辑器 */
.taged { border: 1px solid var(--divider); border-radius: 8px; padding: 8px; background: var(--card); }
.taged .chipsrow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.taged .chipsrow:empty { display: none; }
.taged .tchip { display: inline-flex; align-items: center; gap: 5px; background: var(--primary-tint); color: var(--primary); border-radius: 12px; padding: 3px 10px; font-size: 12px; }
.taged .tchip button { border: none; background: none; color: var(--primary); cursor: pointer; font-size: 12px; padding: 0; line-height: 1; }
.taged .row { display: flex; gap: 8px; }
.taged .row input { flex: 1; width: auto; }
.taged .row button { flex: none; width: 56px; height: 30px; border: none; border-radius: 8px; background: var(--primary-tint); color: var(--primary); font-size: 12px; cursor: pointer; }
.plist { max-height: 60vh; overflow-y: auto; scrollbar-width: none; }
.plist::-webkit-scrollbar { display: none; }
.pitem { padding: 10px 0; border-bottom: 1px solid var(--divider); font-size: 13px; }
.pitem .t { font-weight: 600; margin-bottom: 2px; display: flex; justify-content: space-between; }
.pitem .t span { font-weight: 400; font-size: 11px; color: var(--text-3); }
.pitem .d { font-size: 12px; color: var(--text-2); }
.pitem .ops { margin-top: 6px; }
.pitem .ops button { border: none; background: var(--primary-tint); color: var(--primary); font-weight: 500; border-radius: 12px; padding: 4px 12px; font-size: 11px; cursor: pointer; margin-right: 8px; }
/* 聊天框 */
.chat-list { max-height: 40vh; overflow-y: auto; padding: 4px 0; scrollbar-width: none; }
.chat-list::-webkit-scrollbar { display: none; }
.bub { max-width: 75%; padding: 8px 10px; border-radius: 10px; font-size: 13px; margin-bottom: 8px; line-height: 1.5; }
.bub.other { background: var(--fill); }
.bub.me { margin-left: auto; background: var(--primary); color: #fff; }
.chat-bar { display: flex; gap: 8px; margin-top: 10px; }
.chat-bar input { flex: 1; height: 36px; border: none; background: var(--fill); color: var(--text-1); border-radius: 18px; padding: 0 14px; font-size: 13px; outline: none; }
.chat-bar button { flex: none; width: 72px; }
</style>
</head>
<body data-tab="profile">
<div class="app">

  <header class="appbar">
    <button class="icon-btn" onclick="openDrawer(true)" title="工具与设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <h1>我的</h1>
    <button class="sq-btn" onclick="openPanel('accounts')">切换账号</button>
  </header>

  <main class="page-body">
    <!-- 头部：头像 / 昵称 / 身份认证 -->
    <section class="cardbox">
      <div class="prof-head">
        <div class="ava" id="ava">青</div>
        <div class="who">
          <div class="row1"><b id="nick">青山客</b><span class="tag st" id="authTag">未认证</span></div>
          <p class="bio" id="bio">原创编剧 · 从业三年</p>
        </div>
        <button class="auth-btn" id="authBtn" onclick="openPanel('auth')">去认证</button>
      </div>
      <div class="quick">
        <button onclick="openPanel('fav')"><span class="qicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4-3.9-3.8 5.4-.8z"/></svg></span>收藏</button>
        <button onclick="openPanel('msg')"><span class="qicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 5.5h15V16h-9l-6 4.5z"/><path d="M8.5 10.5h7"/></svg></span>消息</button>
        <button onclick="openPanel('his')"><span class="qicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.2V12l3.2 2"/></svg></span>浏览历史</button>
        <button onclick="openPanel('edit')"><span class="qicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5l1-4L16.8 4.2a1.4 1.4 0 0 1 2 2L7.5 17.5z"/><path d="M14.8 6.2l2 2"/></svg></span>编辑资料</button>
        <button onclick="openPanel('works')"><span class="qicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5H14l4 4v13H6.5z"/><path d="M14 3.5v4h4"/><path d="M9.5 12.5h5.5M9.5 16h4"/></svg></span>我的剧本</button>
        <button onclick="openPanel('inqhub')"><span class="qicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 13.5V12a7.5 7.5 0 0 1 15 0v1.5"/><rect x="3" y="13" width="4" height="5.5" rx="1.6"/><rect x="17" y="13" width="4" height="5.5" rx="1.6"/><path d="M19 18.5c0 1.6-2 2.5-4.5 2.5"/></svg></span>询盘管理</button>
        <button onclick="openPanel('tradehub')"><span class="qicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="6" width="17" height="13" rx="2.5"/><path d="M3.5 10h17"/><circle cx="16.8" cy="14.6" r="1.2"/></svg></span>交易管理</button>
        <button onclick="openPanel('seal')"><span class="qicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4.5h4v5h-4z"/><path d="M6.5 15c0-2.5 2.4-3.5 5.5-3.5s5.5 1 5.5 3.5v1.5h-11z"/><path d="M5 19.5h14"/></svg></span>我的印章</button>
        <button onclick="location.href='creator.html'"><span class="qicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5h15"/><path d="M7.5 16.5v-5M12 16.5V6.5M16.5 16.5v-8"/></svg></span>创作者后台</button>
        <button onclick="location.href='earn.html'"><span class="qicon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.8 8.3L12 11.9l3.2-3.6M12 11.9V16M9.6 12.9h4.8M9.6 14.7h4.8"/></svg></span>福利</button>
      </div>
    </section>

    <!-- 我的书架：竖版书封一行三本 -->
    <section class="cardbox">
      <h3>我的书架</h3>
      <div class="shelf" id="shelf"></div>
    </section>
  </main>

  <!-- 通用弹层 -->
  <div class="sheet-mask" id="panelMask" onclick="closePanel()"></div>
  <div class="sheet" id="panelSheet">
    <h3 id="panelTitle"></h3>
    <div id="panelBody"></div>
  </div>

</div>
<script src="js/app.js?v=17"></script>
<script>
/* ---------- 个人资料与身份认证 ---------- */
function getProf() {
  return JSON.parse(localStorage.getItem('prof') || 'null') || { nick: '青山客', bio: '原创编剧 · 从业三年', auth: false };
}
function saveProf(p) { localStorage.setItem('prof', JSON.stringify(p)); renderHead(); }
function renderHead() {
  var p = getProf();
  document.getElementById('nick').textContent = p.nick;
  document.getElementById('bio').textContent = p.bio;
  document.getElementById('ava').textContent = p.nick.slice(0, 1);
  document.getElementById('authTag').textContent = p.auth ? '已认证创作者' : '未认证';
  var btn = document.getElementById('authBtn');
  btn.textContent = p.auth ? '已认证' : '去认证';
  btn.classList.toggle('on', p.auth);
  btn.disabled = p.auth;
}
var idUp = { front: false, back: false };
function pickId(side) {
  idUp[side] = true;
  var el = document.getElementById(side === 'front' ? 'idFront' : 'idBack');
  el.classList.add('on');
  el.innerHTML = '<span class="ph">✓</span>' + (side === 'front' ? '人像面已上传' : '国徽面已上传');
  toast('原型演示：已选择身份证' + (side === 'front' ? '人像面（正面）' : '国徽面（反面）'));
}
function submitAuth() {
  var n = document.getElementById('authName').value.trim();
  var i = document.getElementById('authId').value.trim();
  if (!n || !i) { toast('请填写真实姓名与身份证号'); return; }
  if (!idUp.front || !idUp.back) { toast('请上传身份证正反面照片'); return; }
  var p = getProf(); p.auth = true; saveProf(p);
  closePanel();
  toast('身份认证提交成功（模拟）');
}
function saveEdit() {
  var n = document.getElementById('editNick').value.trim();
  var b = document.getElementById('editBio').value.trim();
  if (!n) { toast('昵称不能为空'); return; }
  var p = getProf(); p.nick = n; p.bio = b || p.bio; saveProf(p);
  closePanel();
  toast('资料已保存');
}

/* ---------- 我的剧本：五状态筛选 ---------- */
var WORKS = [
  { t: '长风渡我', st: '已上架', ts: '2026-08-12' },
  { t: '夜航船记', st: '审核中', ts: '2026-09-01' },
  { t: '锦绣成灰', st: '已售出', ts: '2026-07-20' },
  { t: '山海拾遗', st: '草稿', ts: '2026-09-05' },
  { t: '星夜兼程', st: '已下架', ts: '2026-06-11' }
];
var WSTS = ['全部', '草稿', '审核中', '已上架', '已售出', '已下架'];
var wCur = '全部';
function renderWorks() {
  var cw = document.getElementById('wChips'), lw = document.getElementById('wList');
  if (!cw || !lw) return;
  cw.innerHTML = WSTS.map(function (s) {
    return '<button class="chip' + (wCur === s ? ' on' : '') + '" onclick="setW(\'' + s + '\')">' + s + '</button>';
  }).join('');
  var list = WORKS.filter(function (w) { return wCur === '全部' || w.st === wCur; });
  lw.innerHTML = list.length
    ? list.map(function (w) {
        var b = findB(w.t);
        return rowHTML(b, [w.st, b.w, b.sub, '可看 ' + b.eps + ' 集', '更新 ' + w.ts],
          '<div class="ops"><button onclick="editWork(\'' + w.t + '\')">修改剧本信息</button></div>', 'sm');
      }).join('')
    : '<p style="font-size:12px;color:var(--text-3);padding:10px 0">该状态下暂无作品</p>';
}
function setW(s) { wCur = s; renderWorks(); }
var editT = '';
function editWork(t) { editT = t; openPanel('editwork'); }
function saveWork() {
  var b = findB(editT);
  var nt = document.getElementById('ewT').value.trim() || b.t;
  b.t = nt;
  b.sub = document.getElementById('ewSub').value;
  var ev = parseInt(document.getElementById('ewEps').value, 10);
  if (isNaN(ev) || ev < 1) { toast('可看集数至少为 1'); return; }
  b.eps = ev;
  b.s = document.getElementById('ewS').value.trim() || b.s;
  b.tags = ewTags.slice();
  for (var i = 0; i < WORKS.length; i++) if (WORKS[i].t === editT) WORKS[i].t = nt;
  editT = nt;
  closePanel();
  openPanel('works');
  toast('剧本信息已更新，当前可看 ' + b.eps + ' 集');
}
var ewTags = [];
function renderEwTags() {
  var el = document.getElementById('ewTagChips');
  if (!el) return;
  el.innerHTML = ewTags.map(function (t, i) { return '<span class="tchip">' + t + '<button onclick="delEwTag(' + i + ')">×</button></span>'; }).join('');
}
function addEwTag() {
  var inp = document.getElementById('ewTagInput');
  var v = inp.value.trim();
  if (!v) return;
  if (ewTags.indexOf(v) < 0 && ewTags.length < 8) ewTags.push(v);
  inp.value = '';
  renderEwTags();
}
function delEwTag(i) { ewTags.splice(i, 1); renderEwTags(); }

/* ---------- 作品行式数据（收藏 / 浏览历史共用） ---------- */
var BROWS = [
  { t: '长风渡我', a: '青山客', s: '夜航船上的摆渡人，载着一桩十年前的失踪悬案。', st: '已上架', w: '12.6万字', sub: '都市', sc: '9.2分', eps: 3, tags: ['悬疑', '反转', '群像'] },
  { t: '春日宴迟', a: '白鹭洲', s: '被退婚的侯府千金，靠一纸婚约重整家门。', st: '已上架', w: '33.0万字', sub: '言情', sc: '8.8分', eps: 5, tags: ['大女主', '甜宠', '复仇'] },
  { t: '夜航船记', a: '半盏灯', s: '夜航船上八位旅客，各怀一段不可告人的往事。', st: '审核中', w: '21.4万字', sub: '悬疑', sc: '9.0分', eps: 2, tags: ['悬疑', '群像', '反转'] },
  { t: '山海拾遗', a: '关山月', s: '最后一个灵兽观察者写下的山海志异。', st: '已上架', w: '9.8万字', sub: '玄幻', sc: '8.5分', eps: 12, tags: ['志异', '治愈'] },
  { t: '锦绣成灰', a: '陌生', s: '绣娘入宫局，以针线搅动朝堂风云。', st: '已上架', w: '45.2万字', sub: '古装', sc: '9.4分', eps: 4, tags: ['权谋', '大女主', '虐恋'] },
  { t: '星夜兼程', a: '林中和', s: '深夜电台主播与城市失眠者互相治愈。', st: '已上架', w: '7.6万字', sub: '都市', sc: '8.6分', eps: 4, tags: ['治愈', '群像'] },
  { t: '风雪夜归人', a: '苏白', s: '雪夜刀客回边关，只为一句十年之约。', st: '已存证', w: '18.3万字', sub: '古装', sc: '8.9分', eps: 3, tags: ['虐恋', '复仇'] },
  { t: '无间之名', a: '沉野', s: '一封匿名信，牵出被掩埋的冤案真相。', st: '审核中', w: '11.1万字', sub: '悬疑', sc: '9.1分', eps: 1, tags: ['悬疑', '反转', '复仇'] }
];
function findB(t) { for (var i = 0; i < BROWS.length; i++) if (BROWS[i].t === t) return BROWS[i]; return BROWS[0]; }
function rowHTML(b, chips, extra, cls) {
  b = b || BROWS[0];
  var cs = chips || [b.st, b.w, b.sub];
  return '<div class="brow' + (cls ? ' ' + cls : '') + '">' +
    '<div class="cv"><img src="' + cvSrc(b.t) + '" alt=""><span class="score">' + b.sc + '</span></div>' +
    '<div class="bd"><h4>' + b.t + '</h4>' +
    '<p class="au">作者：' + b.a + '｜' + b.s + '</p>' +
    '<div class="meta">' + cs.map(function (c) { return '<span>' + c + '</span>'; }).join('') + '</div>' +
    (extra || '') +
    '</div></div>';
}

var quoteIdx = 0;
function fmtYuan(p) { return '¥' + p.toLocaleString('zh-CN'); }
function quoteFor(i) { quoteIdx = i; openPanel('sendquote'); }
function sendQuote() {
  var pv = document.getElementById('qPrice').value.trim();
  var p = parseInt(pv, 10);
  if (pv === '' || isNaN(p) || p <= 0) { toast('请输入大于 0 的报价金额'); return; }
  var q = INQLIST[quoteIdx];
  QUOTES.unshift({ w: q.w, c: q.c, p: p, st: '待甲方确认' });
  closePanel();
  openPanel('quote');
  toast('报价单已发送：' + fmtYuan(p));
}

function openPanel(key) {
  var p = PANELS[key];
  if (!p) return;
  document.getElementById('panelTitle').textContent = p.title;
  document.getElementById('panelBody').innerHTML = p.html();
  if (p.post) p.post();
  document.getElementById('panelSheet').classList.add('show');
  document.getElementById('panelMask').classList.add('show');
}
function closePanel() {
  document.getElementById('panelSheet').classList.remove('show');
  document.getElementById('panelMask').classList.remove('show');
}
function sendChat() {
  var box = document.getElementById('chatInput');
  var v = box.value.trim();
  if (!v) { toast('请输入消息内容'); return; }
  var list = document.getElementById('chatList');
  var d = document.createElement('div');
  d.className = 'bub me';
  d.textContent = v;
  list.appendChild(d);
  list.scrollTop = list.scrollHeight;
  box.value = '';
}

  '浏览《锦绣成灰》剧本详情', '浏览《星夜兼程》剧本详情', '浏览《风雪夜归人》剧本详情', '浏览《无间之名》剧本详情'
];
function hisItem(i) {
  var txt = HIS_POOL[i % HIS_POOL.length];
  var m = txt.match(/《([^》]+)》/);
  var b = findB(m ? m[1] : '');
  var d = new Date(Date.now() - Math.floor(i / 2) * 86400000);
  var mm = ('0' + (d.getMonth() + 1)).slice(-2), dd = ('0' + d.getDate()).slice(-2);
  var hh = ('0' + (9 + (i * 3) % 12)).slice(-2), mi = ('0' + ((i * 17) % 60)).slice(-2);
  var ev = txt.replace(/《[^》]+》/, '').trim() || '浏览';
  return rowHTML(b, [ev, mm + '-' + dd + ' ' + hh + ':' + mi, b.sub]);
}
