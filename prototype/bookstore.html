<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>书城 · 智能剧本创作平台原型</title>
<link rel="stylesheet" href="css/app.css?v=7">
<style>
/* 分类独立行 + 计数右对齐 */
.cat-row { padding: 12px 16px 0; }
.rec-row .count { margin-left: auto; }
/* 排行榜卡片 */
.rank { margin: 12px 16px 0; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-card); padding: 14px 12px 4px; }
.rk-tabs { display: flex; align-items: baseline; gap: 14px; }
.rk-tabs button { border: none; background: none; font-size: 13px; color: var(--text-3); cursor: pointer; padding: 0; }
.rk-tabs button.on { font-size: 17px; font-weight: 700; color: var(--text-1); }
.rk-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 12px 0 2px; }
.rk-chips::-webkit-scrollbar { display: none; }
.rk-chip { flex: none; border: none; background: var(--fill); color: var(--text-2); border-radius: 8px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
.rk-chip.on { background: var(--primary); color: #fff; font-weight: 600; }
.rk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.rk-item { display: flex; gap: 8px; padding: 10px 0; cursor: pointer; }
.rk-item .cv { flex: none; width: 52px; height: 70px; border-radius: 6px; background: linear-gradient(160deg, var(--primary-tint), #D7E3F5); display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 11px; position: relative; overflow: hidden; }
.rk-item .no { flex: none; width: 15px; font-size: 15px; font-weight: 700; color: var(--text-3); line-height: 20px; }
.rk-item .no.n1 { color: #E14B4B; }
.rk-item .no.n2 { color: #E07B39; }
.rk-item .no.n3 { color: #E6A23C; }
.rk-item .tt { min-width: 0; flex: 1; }
.rk-item .tt h4 { font-size: 13px; color: var(--text-1); font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rk-item .tt p { font-size: 11px; color: var(--text-3); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body data-tab="bookstore">
<div class="app">

  <header class="appbar">
    <div class="search-input">
      <button class="icon-btn" onclick="openDrawer(true)" title="工具与设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <input id="q" placeholder="搜索" enterkeyhint="search">
    </div>
    <button class="sq-btn" onclick="openSheet(true)">筛选</button>
  </header>

  <main class="page-body">
    <!-- 搜索历史（一期新增需求） -->
    <div class="history" id="history">
      <div class="history-head"><span>搜索历史</span><button onclick="clearHistory()">清空</button></div>
      <div class="chips" id="historyChips"></div>
    </div>

    <!-- 排行榜：四榜 + 题材筛选 -->
    <section class="rank">
      <div class="rk-tabs" id="rkTabs"></div>
      <div class="rk-chips" id="rkChips"></div>
      <div class="rk-grid" id="rkGrid"></div>
    </section>

    <!-- 推荐标题 + 命中计数 -->
    <div class="rec-row">
      <h2>推荐</h2>
      <span class="count" id="count"></span>
    </div>

    <!-- 展览：双列作品卡片 -->
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">没有找到匹配的作品<br>试试调整筛选条件或搜索词</div>
  </main>

  <!-- 筛选条件底部弹层：时长 / 成本（分类已独立成行；版权筛选一期删除，不做） -->
  <div class="sheet-mask" id="sheetMask" onclick="openSheet(false)"></div>
  <div class="sheet" id="sheet">
    <h3>筛选条件</h3>
    <div class="fgroup"><div class="ft">时长</div><div class="chips" id="fDur"></div></div>
    <div class="fgroup"><div class="ft">成本</div><div class="chips" id="fCost"></div></div>
    <div class="fgroup"><div class="ft">审核状态</div><div class="chips" id="fSt"></div></div>
    <div class="fgroup"><div class="ft">标签（可多选）</div><div class="chips" id="fTags"></div></div>
    <div class="sheet-foot">
      <button class="btn-outline" onclick="resetFilter()">重置</button>
      <button class="btn-solid" onclick="openSheet(false)">确认</button>
    </div>
  </div>

</div>
<script src="js/app.js?v=17"></script>
<script>
/* ---------- 模拟数据 ---------- */
var BOOKS = [
  { t: '长风渡我',   a: '青山客',   sub: '都市', dur: '3-5分钟/集',  eps: 3, cost: '1万-5万',   st: '已上架',   sc: '9.2', ts: '2026-08-12', reads: 12.4, tags: ['悬疑', '反转', '群像'], s: '夜航船上的摆渡人，载着一桩十年前的失踪悬案。' },
  { t: '春日宴迟',   a: '白鹭洲',   sub: '言情', dur: '3-5分钟/集',  eps: 5, cost: '5万-10万',  st: '已上架',   sc: '8.8', ts: '2026-06-30', reads: 9.8,  tags: ['大女主', '甜宠', '复仇'], s: '被退婚的侯府千金，靠一纸婚约重整家门。' },
  { t: '夜航船记',   a: '半盏灯',   sub: '悬疑', dur: '5-10分钟/集', eps: 2, cost: '1万-5万',   st: '审核中',   sc: '9.0', ts: '2026-09-01', reads: 8.3,  tags: ['悬疑', '群像', '反转'], s: '夜航船上八位旅客，各怀一段不可告人的往事。' },
  { t: '山海拾遗',   a: '关山月',   sub: '玄幻', dur: '1-3分钟/集',  eps: 12, cost: '免费',      st: '已上架',   sc: '8.5', ts: '2026-07-15', reads: 6.5,  tags: ['志异', '治愈'], s: '最后一个灵兽观察者写下的山海志异。' },
  { t: '锦绣成灰',   a: '陌生',     sub: '古装', dur: '5-10分钟/集', eps: 4, cost: '5万-10万',  st: '已上架',   sc: '9.4', ts: '2026-05-20', reads: 15.2, tags: ['权谋', '大女主', '虐恋'], s: '绣娘入宫局，以针线搅动朝堂风云。' },
  { t: '星夜兼程',   a: '林中和',   sub: '都市', dur: '1-3分钟/集',  eps: 4, cost: '1万以下',   st: '已上架',   sc: '8.6', ts: '2026-08-25', reads: 4.2,  tags: ['治愈', '群像'], s: '深夜电台主播与城市失眠者互相治愈。' },
  { t: '风雪夜归人', a: '苏白',     sub: '古装', dur: '3-5分钟/集',  eps: 3, cost: '1万-5万',   st: '已存证',   sc: '8.9', ts: '2026-04-11', reads: 7.7,  tags: ['虐恋', '复仇'], s: '雪夜刀客回边关，只为一句十年之约。' },
  { t: '无间之名',   a: '沉野',     sub: '悬疑', dur: '1-3分钟/集',  eps: 1, cost: '免费',      st: '审核中',   sc: '9.1', ts: '2026-09-05', reads: 5.9,  tags: ['悬疑', '反转', '复仇'], s: '一封匿名信，牵出被掩埋的冤案真相。' },
  { t: '银河修理员', a: '陆离',     sub: '科幻', dur: '3-5分钟/集',  eps: 6, cost: '5万-10万',  st: '已上架',   sc: '9.0', ts: '2026-08-30', reads: 10.6, tags: ['科幻', '治愈', '群像'], s: '退休飞船修理员与漂流在银河废墟里的 AI 少女。' },
  { t: '楼下请回答', a: '阿盏',     sub: '喜剧', dur: '1-3分钟/集',  eps: 8, cost: '1万以下',   st: '已上架',   sc: '8.7', ts: '2026-09-03', reads: 9.1,  tags: ['喜剧', '群像', '治愈'], s: '一通深夜电台连线，串起整栋居民楼的荒诞日常。' },
  { t: '巷尾早餐铺', a: '温言',     sub: '现实', dur: '3-5分钟/集',  eps: 4, cost: '1万-5万',   st: '已上架',   sc: '9.3', ts: '2026-07-08', reads: 11.8, tags: ['治愈', '群像', '大女主'], s: '开了二十年的早餐铺，见证老街三代人的来与往。' },
  { t: '凤栖台',     a: '谢琳琅',   sub: '古装', dur: '5-10分钟/集', eps: 6, cost: '5万-10万',  st: '审核中',   sc: '8.9', ts: '2026-09-06', reads: 7.2,  tags: ['权谋', '复仇', '大女主'], s: '落难公主化名入宫，一步步收回地图上的旧山河。' },
  { t: '雾港迷案',   a: '沈孤舟',   sub: '悬疑', dur: '5-10分钟/集', eps: 5, cost: '1万-5万',   st: '已上架',   sc: '9.1', ts: '2026-06-18', reads: 13.6, tags: ['悬疑', '反转', '复仇'], s: '雾港小镇三桩旧案，最终指向同一艘失踪的船。' },
  { t: '心动信号塔', a: '苏浅浅',   sub: '言情', dur: '1-3分钟/集',  eps: 10, cost: '免费',     st: '已上架',   sc: '8.4', ts: '2026-08-05', reads: 8.8,  tags: ['甜宠', '治愈', '大女主'], s: '信号塔修理员与气象观测员，在电波里交换心动。' },
  { t: '山神娶亲',   a: '白泽君',   sub: '玄幻', dur: '3-5分钟/集',  eps: 7, cost: '1万-5万',   st: '已存证',   sc: '8.8', ts: '2026-05-28', reads: 6.9,  tags: ['志异', '反转', '虐恋'], s: '山神六十年一娶亲，今年娶到的新娘带着斩妖刀。' },
  { t: '重启2009',   a: '老周不老', sub: '都市', dur: '3-5分钟/集',  eps: 9, cost: '1万-5万',   st: '已上架',   sc: '8.6', ts: '2026-09-08', reads: 10.2, tags: ['反转', '复仇', '群像'], s: '破产夜中年男人睁眼回到 2009，记忆全在。' }
];
var DURS  = ['全部', '1-3分钟/集', '3-5分钟/集', '5-10分钟/集'];
var COSTS = ['全部', '免费', '1万以下', '1万-5万', '5万-10万'];
var STS   = ['全部', '已上架', '审核中', '已存证'];
var TAGOPTS = (function () {
  var seen = [];
  BOOKS.forEach(function (b) { (b.tags || []).forEach(function (t) { if (seen.indexOf(t) < 0) seen.push(t); }); });
  return seen;
})();
var state = { q: '', dur: '全部', cost: '全部', st: '全部', tags: [] };

/* ---------- 排行榜：推荐榜 / 热读榜 / 好评榜 / 新作榜 ---------- */
var RKTABS = [
  { id: 'rec', v: '推荐榜' },
  { id: 'hot', v: '热读榜' },
  { id: 'top', v: '好评榜' },
  { id: 'new', v: '新作榜' }
];
var rkTab = 'rec', rkSub = '全部';
var RKSUBS = ['全部'].concat((function () {
  var s = [];
  BOOKS.forEach(function (b) { if (s.indexOf(b.sub) < 0) s.push(b.sub); });
  return s;
})());
function rankList() {
  var list = BOOKS.filter(function (b) { return rkSub === '全部' || b.sub === rkSub; });
  if (rkTab === 'hot') list = list.slice().sort(function (a, b) { return b.reads - a.reads; });
  else if (rkTab === 'top') list = list.slice().sort(function (a, b) { return parseFloat(b.sc) - parseFloat(a.sc); });
  else if (rkTab === 'new') list = list.slice().sort(function (a, b) { return a.ts < b.ts ? 1 : -1; });
  return list.slice(0, 8);
}
function setRkTab(id) { rkTab = id; renderRank(); }
function setRkSub(v) { rkSub = v; renderRank(); }
function renderRank() {
  document.getElementById('rkTabs').innerHTML = RKTABS.map(function (t) {
    return '<button class="' + (rkTab === t.id ? 'on' : '') + '" onclick="setRkTab(\'' + t.id + '\')">' + t.v + '</button>';
  }).join('');
  document.getElementById('rkChips').innerHTML = RKSUBS.map(function (v) {
    return '<button class="rk-chip' + (rkSub === v ? ' on' : '') + '" onclick="setRkSub(\'' + v + '\')">' + v + '</button>';
  }).join('');
  document.getElementById('rkGrid').innerHTML = rankList().map(function (b, i) {
    return '<div class="rk-item" onclick="openDetail(' + BOOKS.indexOf(b) + ')">' +
      '<div class="cv"><img src="' + cvSrc(b.t) + '" alt=""></div>' +
      '<span class="no' + (i < 3 ? ' n' + (i + 1) : '') + '">' + (i + 1) + '</span>' +
      '<div class="tt"><h4>' + b.t + '</h4><p>' + b.sub + ' · ' + (b.tags || []).slice(0, 2).join(' · ') + '</p></div></div>';
  }).join('');
}

/* ---------- 渲染 ---------- */
function chipHTML(group, val) {
  return '<button class="chip' + (state[group] === val ? ' on' : '') + '" onclick="setFilter(\'' + group + '\',\'' + val + '\')">' + val + '</button>';
}
function tagChipHTML(t) {
  return '<button class="chip' + (state.tags.indexOf(t) > -1 ? ' on' : '') + '" onclick="toggleTag(\'' + t + '\')">' + t + '</button>';
}
function toggleTag(t) {
  var i = state.tags.indexOf(t);
  if (i > -1) state.tags.splice(i, 1); else state.tags.push(t);
  renderChips();
  render();
}
function renderChips() {
  document.getElementById('fDur').innerHTML  = DURS.map(function (v) { return chipHTML('dur', v); }).join('');
  document.getElementById('fCost').innerHTML = COSTS.map(function (v) { return chipHTML('cost', v); }).join('');
  document.getElementById('fSt').innerHTML   = STS.map(function (v) { return chipHTML('st', v); }).join('');
  document.getElementById('fTags').innerHTML = TAGOPTS.map(tagChipHTML).join('');
}
function filtered() {
  return BOOKS.filter(function (b) {
    return (state.dur === '全部' || b.dur === state.dur) &&
           (state.cost === '全部' || b.cost === state.cost) &&
           (state.st === '全部' || b.st === state.st) &&
           (!state.tags.length || state.tags.some(function (t) { return (b.tags || []).indexOf(t) > -1; })) &&
           (!state.q || (b.t + b.a + b.s).indexOf(state.q) > -1);
  });
}
function render() {
  var list = filtered();
  document.getElementById('grid').innerHTML = list.map(function (b) {
    var stCls = b.st === '已上架' ? 'tag ok' : b.st === '审核中' ? 'tag warn' : 'tag st';
    var idx = BOOKS.indexOf(b);
    return '<div class="card" onclick="openDetail(' + idx + ')">' +
      '<div class="cover"><img src="' + cvSrc(b.t) + '" alt=""></div>' +
      '<div class="info"><h3>' + b.t + '</h3><p class="syn">' + b.s + '</p>' +
      '<div class="tags"><span class="' + stCls + '">' + b.st + '</span><span class="tag">' + b.sub + '</span>' +
      '<span class="tag">' + b.dur + '</span><span class="tag">' + b.cost + '</span></div></div></div>';
  }).join('');
  document.getElementById('empty').style.display = list.length ? 'none' : 'block';
  var active = state.dur !== '全部' || state.cost !== '全部' || state.st !== '全部' || state.tags.length || state.q;
  document.getElementById('count').textContent = active ? list.length + ' 部' : '';
}
function openDetail(i) { location.href = 'book_detail.html?t=' + encodeURIComponent(BOOKS[i].t); }
function setFilter(group, val) {
  state[group] = val;
  renderChips();
  render();
}
function resetFilter() {
  state.dur = state.cost = '全部';
  state.st = '全部';
  state.tags = [];
  renderChips();
  render();
  toast('已重置筛选条件');
}
function openSheet(open) {
  document.getElementById('sheet').classList.toggle('show', open);
  document.getElementById('sheetMask').classList.toggle('show', open);
}

/* ---------- 搜索与搜索历史 ---------- */
var HKEY = 'bs_history';
function getH() { try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch (e) { return []; } }
function renderHistory() {
  var h = getH();
  document.getElementById('historyChips').innerHTML = h.length
    ? h.map(function (v) { return '<button class="chip" onclick="searchFromHistory(\'' + v + '\')">' + v + '</button>'; }).join('')
    : '<span class="none">暂无搜索历史</span>';
}
function pushHistory(v) {
  var h = getH().filter(function (x) { return x !== v; });
  h.unshift(v);
  localStorage.setItem(HKEY, JSON.stringify(h.slice(0, 8)));
  renderHistory();
}
function clearHistory() {
  localStorage.removeItem(HKEY);
  renderHistory();
  toast('搜索历史已清空');
}
function doSearch(v) {
  v = (v || '').trim();
  if (!v) { toast('请输入搜索关键词'); return; }
  pushHistory(v);
  state.q = v;
  render();
  showHistory(false);
  document.getElementById('q').blur();
}
function searchFromHistory(v) {
  document.getElementById('q').value = v;
  state.q = v;
  render();
  showHistory(false);
}
function showHistory(show) {
  document.getElementById('history').classList.toggle('show', show);
}

/* ---------- 事件绑定 ---------- */
var input = document.getElementById('q');
var hideTimer = null;
input.addEventListener('focus', function () { clearTimeout(hideTimer); if (!input.value) showHistory(true); });
input.addEventListener('blur', function () { clearTimeout(hideTimer); hideTimer = setTimeout(function () { showHistory(false); }, 180); });
input.addEventListener('input', function () { showHistory(!input.value); });
input.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(input.value); });

renderChips();
render();
renderHistory();
renderRank();
</script>
</body>
</html>
