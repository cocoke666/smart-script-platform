<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>试读 · 智能剧本创作平台原型</title>
<link rel="stylesheet" href="css/app.css?v=7">
<style>
/* ---------- 阅读页专属样式 ---------- */
.read-body { flex: 1; overflow-y: auto; padding: 18px 20px 24px; scrollbar-width: none; -ms-overflow-style: none; }
.read-body::-webkit-scrollbar { display: none; }
.read-title { font-size: 19px; color: var(--text-1); font-weight: 700; margin-bottom: 6px; }
.read-meta { font-size: 11px; color: var(--text-3); margin-bottom: 16px; }
.read-text { font-size: 15px; color: var(--text-1); line-height: 2; white-space: pre-wrap; }
.read-text.fs-sm { font-size: 14px; }
.read-text.fs-lg { font-size: 18px; }
.read-end { margin-top: 20px; padding: 12px; background: var(--primary-tint); border-radius: 10px; font-size: 12px; color: var(--primary); line-height: 1.8; }
.read-bar { flex: none; display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--card); box-shadow: 0 -1px 0 var(--divider); }
.read-bar .pos { font-size: 12px; color: var(--text-2); }
.read-bar .pos b { color: var(--primary); }
.read-bar button { flex: none; }
.read-bar button:disabled { opacity: .4; cursor: not-allowed; }
</style>
</head>
<body class="no-chrome">
<div class="app">

  <header class="appbar">
    <button class="icon-btn" id="backBtn" title="返回详情"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
    <h1>试读</h1>
    <button class="icon-btn" onclick="cycleFs()" title="字号"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19L9.5 5l5.5 14M5.8 14.5h7.4M16 19l2.4-6 2.6 6M16.9 16.8h4.2"/></svg></button>
  </header>

  <main class="read-body">
    <h2 class="read-title" id="rTitle"></h2>
    <p class="read-meta" id="rMeta"></p>
    <div class="read-text" id="rText"></div>
    <div class="read-end" id="rEnd"></div>
  </main>

  <!-- 底部翻集栏 -->
  <div class="read-bar">
    <button class="btn-outline" id="prevBtn" onclick="move(-1)">上一集</button>
    <span class="pos">第 <b id="rEpN"></b> / <span id="rEpsN"></span> 集</span>
    <button class="btn-outline" id="nextBtn" onclick="move(1)">下一集</button>
  </div>

</div>
<script src="js/app.js?v=17"></script>
<script>
/* ---------- 与详情页一致的模拟数据（eps = 作者已上传、全部可看的集数） ---------- */
var BOOKS = [
  { t: '长风渡我',   a: '青山客',   sub: '都市', dur: '3-5分钟/集',  eps: 3 },
  { t: '春日宴迟',   a: '白鹭洲',   sub: '言情', dur: '3-5分钟/集',  eps: 5 },
  { t: '夜航船记',   a: '半盏灯',   sub: '悬疑', dur: '5-10分钟/集', eps: 2 },
  { t: '山海拾遗',   a: '关山月',   sub: '玄幻', dur: '1-3分钟/集',  eps: 12 },
  { t: '锦绣成灰',   a: '陌生',     sub: '古装', dur: '5-10分钟/集', eps: 4 },
  { t: '星夜兼程',   a: '林中和',   sub: '都市', dur: '1-3分钟/集',  eps: 4 },
  { t: '风雪夜归人', a: '苏白',     sub: '古装', dur: '3-5分钟/集',  eps: 3 },
  { t: '无间之名',   a: '沉野',     sub: '悬疑', dur: '1-3分钟/集',  eps: 1 },
  { t: '银河修理员', a: '陆离',     sub: '科幻', dur: '3-5分钟/集',  eps: 6 },
  { t: '楼下请回答', a: '阿盏',     sub: '喜剧', dur: '1-3分钟/集',  eps: 8 },
  { t: '巷尾早餐铺', a: '温言',     sub: '现实', dur: '3-5分钟/集',  eps: 4 },
  { t: '凤栖台',     a: '谢琳琅',   sub: '古装', dur: '5-10分钟/集', eps: 6 },
  { t: '雾港迷案',   a: '沈孤舟',   sub: '悬疑', dur: '5-10分钟/集', eps: 5 },
  { t: '心动信号塔', a: '苏浅浅',   sub: '言情', dur: '1-3分钟/集',  eps: 10 },
  { t: '山神娶亲',   a: '白泽君',   sub: '玄幻', dur: '3-5分钟/集',  eps: 7 },
  { t: '重启2009',   a: '老周不老', sub: '都市', dur: '3-5分钟/集',  eps: 9 }
];
function param(name) { var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)')); return m ? decodeURIComponent(m[1]) : ''; }
var cur = (function () { var t = param('t'); for (var i = 0; i < BOOKS.length; i++) if (BOOKS[i].t === t) return BOOKS[i]; return BOOKS[0]; })();
var ep = Math.min(Math.max(parseInt(param('ep'), 10) || 1, 1), cur.eps);
document.getElementById('backBtn').onclick = function () { location.href = 'book_detail.html?t=' + encodeURIComponent(cur.t); };

/* ---------- 整集剧本演示文本：按集号轮转素材池 ---------- */
var EPSC = ['雾夜 · 渡船', '日 · 码头茶棚', '夜 · 名册阁', '晨 · 江面'];
var EPD = ['雾从船头漫上来，灯笼的光被压成一团淡黄。', '茶棚里人声低伏，说书人拍到第三下醒木。', '名册阁的铜灯忽明忽暗，照见无页之名。', '江面浮起薄霜，第一班渡船敲响了梆子。'];
var EPDIA = [
  ['长风：「你不是册上的魂。」', '少女：「册子上，也不写活人的名字。」'],
  ['说书人：「这段往事，客官们听个热闹就好。」', '少女：「热闹底下，埋的是十条人命。」'],
  ['守册人：「名册无页，因果无凭。」', '长风：「那我这一船，渡的是谁？」'],
  ['船工：「头班船，不上生人。」', '少女：「我不是生人，我是来捞人的。」']
];
function epScript(n) {
  var L = [];
  for (var s = 0; s < 3; s++) {
    var k = (n + s) % EPSC.length;
    L.push('第 ' + (s + 1) + ' 场　' + EPSC[k] + '　' + (s % 2 ? '日' : '夜'));
    L.push(EPD[k]);
    L.push(EPDIA[k][0]);
    L.push(EPDIA[k][1]);
    L.push('');
  }
  L.push('长风（画外音）：「这一集的因果，就先系到这里。」');
  L.push('');
  L.push('—— 第 ' + n + ' 集完 ——');
  return L.join('\n');
}

/* ---------- 渲染 ---------- */
function render() {
  document.getElementById('rTitle').textContent = '《' + cur.t + '》第 ' + ep + ' 集';
  document.getElementById('rMeta').textContent = cur.a + ' 著 · ' + cur.sub + ' · 本集时长 ' + cur.dur + ' · 作者已上传 ' + cur.eps + ' 集，全部开放阅读';
  document.getElementById('rText').textContent = epScript(ep);
  document.getElementById('rEnd').innerHTML = '以上为作者上传的试看内容。平台仅展示已上传集数，如需完整剧本合作，请返回详情页发起询盘；双方谈判签约后自行交割，不经平台。';
  document.getElementById('rEpN').textContent = ep;
  document.getElementById('rEpsN').textContent = cur.eps;
  document.getElementById('prevBtn').disabled = ep <= 1;
  document.getElementById('nextBtn').disabled = ep >= cur.eps;
  document.querySelector('.read-body').scrollTop = 0;
}
function move(d) {
  var n = ep + d;
  if (n < 1 || n > cur.eps) return;
  ep = n;
  render();
}
/* 字号三档循环 */
var FS = ['', 'fs-sm', 'fs-lg'];
var fi = 0;
function cycleFs() {
  fi = (fi + 1) % FS.length;
  var el = document.getElementById('rText');
  el.className = 'read-text' + (FS[fi] ? ' ' + FS[fi] : '');
  toast(FS[fi] === 'fs-sm' ? '小字号' : FS[fi] === 'fs-lg' ? '大字号' : '标准字号');
}

render();
</script>
</body>
</html>
