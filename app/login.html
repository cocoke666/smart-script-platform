<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登录/注册 · 智能剧本创作平台原型</title>
<link rel="stylesheet" href="css/app.css?v=7">
<style>
/* ---------- 登录/注册页专属样式 ---------- */
.login-body { flex: 1; overflow-y: auto; padding: 40px 28px 24px; scrollbar-width: none; -ms-overflow-style: none; }
.login-body::-webkit-scrollbar { display: none; }
.logo { width: 64px; height: 64px; border-radius: 50%; background: var(--primary-tint); color: var(--primary); margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; }
.brand { text-align: center; margin-bottom: 24px; }
.brand h1 { font-size: 18px; margin-bottom: 4px; color: var(--text-1); }
.brand p { font-size: 12px; color: var(--text-3); }
.seg { display: flex; background: var(--fill); border-radius: 20px; padding: 3px; margin-bottom: 20px; }
.seg button { flex: 1; border: none; background: none; padding: 8px 0; font-size: 14px; cursor: pointer; border-radius: 17px; color: var(--text-2); transition: .15s; }
.seg button.on { background: var(--card); color: var(--primary); font-weight: 600; box-shadow: var(--shadow-card); }
.fld { margin-bottom: 12px; }
.fld label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
.fld input { width: 100%; height: 42px; border: 1px solid var(--divider); border-radius: 10px; padding: 0 12px; font-size: 14px; background: var(--card); color: var(--text-1); outline: none; }
.fld input:focus { border-color: var(--primary); }
.code-row { display: flex; gap: 8px; }
.code-row input { flex: 1; }
.code-btn { flex: none; width: 104px; height: 42px; border: none; border-radius: 10px; background: var(--primary-tint); color: var(--primary); font-size: 12px; font-weight: 500; cursor: pointer; }
.code-btn:disabled { color: var(--text-3); background: var(--fill); }
.pwd-row { display: flex; justify-content: space-between; align-items: center; margin: -4px 0 12px; }
.pwd-row a { font-size: 12px; color: var(--text-3); cursor: pointer; }
.type-cards { display: flex; gap: 10px; margin-bottom: 14px; }
.type-card { flex: 1; border: 1.5px solid var(--divider); border-radius: 10px; padding: 10px; cursor: pointer; text-align: center; background: var(--card); transition: .15s; }
.type-card b { display: block; font-size: 13px; margin-bottom: 2px; color: var(--text-1); }
.type-card span { font-size: 11px; color: var(--text-3); }
.type-card.on { border-color: var(--primary); background: var(--primary-tint); }
.type-card.on b { color: var(--primary); }
.agree { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; color: var(--text-2); margin: 4px 0 14px; cursor: pointer; }
.agree input { margin-top: 2px; accent-color: var(--primary); }
.agree a { color: var(--primary); cursor: pointer; }
.demo { border: 1px dashed var(--divider); border-radius: 10px; padding: 10px 12px; margin-top: 16px; background: var(--warm-gray); }
.demo p { font-size: 11px; color: var(--text-3); margin-bottom: 6px; }
.demo .chips { display: flex; gap: 8px; }
.third { margin-top: 28px; text-align: center; }
.third .line { display: flex; align-items: center; gap: 10px; color: var(--text-3); font-size: 11px; margin-bottom: 14px; }
.third .line::before, .third .line::after { content: ''; flex: 1; border-top: 1px solid var(--divider); }
.third .icons { display: flex; justify-content: center; gap: 22px; }
.third .icons button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--divider); background: var(--card); color: var(--text-2); font-size: 12px; cursor: pointer; }
</style>
</head>
<body class="no-chrome">
<div class="app">

  <div class="login-body">
    <div class="logo">剧</div>
    <div class="brand">
      <h1>智能剧本创作平台</h1>
      <p>剧本创作 · 版权交易 · 短剧发行 一站式平台</p>
    </div>

    <div class="seg">
      <button id="segLogin" class="on" onclick="setTab('login')">登录</button>
      <button id="segReg" onclick="setTab('reg')">注册</button>
    </div>

    <!-- 登录 -->
    <div id="pLogin">
      <div class="fld"><label>手机号</label><input id="lgPhone" type="tel" maxlength="11" placeholder="请输入手机号"></div>
      <div class="fld"><label>密码</label><input id="lgPwd" type="password" placeholder="请输入密码"></div>
      <div class="pwd-row"><span></span><a onclick="toast('原型演示：请联系客服重置密码')">忘记密码？</a></div>
      <button class="btn-solid" style="width:100%" onclick="doLogin()">登 录</button>
      <div class="demo">
        <p>演示账号（密码均为 123456），点击自动填充：</p>
        <div class="chips">
          <button class="chip" onclick="fillDemo(0)">创作者 13800000000</button>
          <button class="chip" onclick="fillDemo(1)">甲方 13900000000</button>
        </div>
      </div>
    </div>

    <!-- 注册 -->
    <div id="pReg" style="display:none">
      <div class="fld">
        <label>选择账号类型（登录后按类型进入对应"我的"页面）</label>
        <div class="type-cards">
          <div class="type-card on" id="tcCreator" onclick="pickType('creator')"><b>创作者</b><span>发布剧本 · 接单赚钱</span></div>
          <div class="type-card" id="tcClient" onclick="pickType('client')"><b>甲方</b><span>采买剧本 · 制作短剧</span></div>
        </div>
      </div>
      <div class="fld"><label>手机号</label><input id="rgPhone" type="tel" maxlength="11" placeholder="请输入手机号"></div>
      <div class="fld"><label>验证码</label>
        <div class="code-row">
          <input id="rgCode" maxlength="4" placeholder="原型演示：固定 1234">
          <button class="code-btn" id="codeBtn" onclick="sendCode()">获取验证码</button>
        </div>
      </div>
      <div class="fld"><label>密码</label><input id="rgPwd" type="password" placeholder="不少于 6 位"></div>
      <div class="fld"><label>确认密码</label><input id="rgPwd2" type="password" placeholder="请再次输入密码"></div>
      <label class="agree"><input type="checkbox" id="rgAgree">我已阅读并同意<a onclick="toast('原型演示：用户协议')">《用户协议》</a>与<a onclick="toast('原型演示：隐私政策')">《隐私政策》</a></label>
      <button class="btn-solid" style="width:100%" onclick="doReg()">注 册</button>
    </div>

    <!-- 第三方登录 -->
    <div class="third">
      <div class="line">其他登录方式</div>
      <div class="icons">
        <button onclick="toast('原型演示：微信登录')">微信</button>
        <button onclick="toast('原型演示：QQ 登录')">QQ</button>
        <button onclick="toast('原型演示：微博登录')">微博</button>
      </div>
    </div>
  </div>

</div>
<script src="js/app.js?v=17"></script>
<script>
/* ---------- 演示账号与本地注册账号 ---------- */
var DEMO = [
  { phone: '13800000000', pwd: '123456', type: 'creator' },
  { phone: '13900000000', pwd: '123456', type: 'client' }
];
function getAccts() { return JSON.parse(localStorage.getItem('accts') || '[]'); }
var regType = 'creator';

function setTab(t) {
  document.getElementById('segLogin').classList.toggle('on', t === 'login');
  document.getElementById('segReg').classList.toggle('on', t === 'reg');
  document.getElementById('pLogin').style.display = t === 'login' ? '' : 'none';
  document.getElementById('pReg').style.display = t === 'reg' ? '' : 'none';
}
function pickType(t) {
  regType = t;
  document.getElementById('tcCreator').classList.toggle('on', t === 'creator');
  document.getElementById('tcClient').classList.toggle('on', t === 'client');
}
function fillDemo(i) {
  document.getElementById('lgPhone').value = DEMO[i].phone;
  document.getElementById('lgPwd').value = DEMO[i].pwd;
}
var cdTimer = null;
function sendCode() {
  var ph = document.getElementById('rgPhone').value.trim();
  if (!/^1\d{10}$/.test(ph)) { toast('请输入正确的 11 位手机号'); return; }
  toast('验证码已发送（原型演示：1234）');
  var btn = document.getElementById('codeBtn'), left = 60;
  btn.disabled = true;
  btn.textContent = left + ' 秒后重发';
  cdTimer = setInterval(function () {
    left--;
    if (left <= 0) { clearInterval(cdTimer); btn.disabled = false; btn.textContent = '获取验证码'; }
    else btn.textContent = left + ' 秒后重发';
  }, 1000);
}
function doReg() {
  var ph = document.getElementById('rgPhone').value.trim();
  var code = document.getElementById('rgCode').value.trim();
  var p1 = document.getElementById('rgPwd').value;
  var p2 = document.getElementById('rgPwd2').value;
  if (!/^1\d{10}$/.test(ph)) { toast('请输入正确的 11 位手机号'); return; }
  var all = DEMO.concat(getAccts());
  for (var i = 0; i < all.length; i++) {
    if (all[i].phone === ph) { toast('该手机号已注册，请直接登录'); setTab('login'); return; }
  }
  if (code !== '1234') { toast('验证码错误（原型演示固定为 1234）'); return; }
  if (p1.length < 6) { toast('密码不少于 6 位'); return; }
  if (p1 !== p2) { toast('两次输入的密码不一致'); return; }
  if (!document.getElementById('rgAgree').checked) { toast('请先阅读并同意用户协议'); return; }
  var accts = getAccts();
  accts.push({ phone: ph, pwd: p1, type: regType });
  localStorage.setItem('accts', JSON.stringify(accts));
  toast('注册成功，请登录');
  setTab('login');
  document.getElementById('lgPhone').value = ph;
}
function doLogin() {
  var ph = document.getElementById('lgPhone').value.trim();
  var pwd = document.getElementById('lgPwd').value;
  if (!ph || !pwd) { toast('请输入手机号和密码'); return; }
  var all = DEMO.concat(getAccts()), hit = null;
  for (var i = 0; i < all.length; i++) {
    if (all[i].phone === ph) { hit = all[i]; break; }
  }
  if (!hit) { toast('账号不存在，请先注册'); return; }
  if (hit.pwd !== pwd) { toast('密码错误，请重新输入'); return; }
  toast('登录成功，正在进入' + (hit.type === 'client' ? '甲方' : '创作者') + '账号');
  setTimeout(function () {
    location.href = hit.type === 'client' ? 'profile_client.html' : 'profile.html';
  }, 700);
}
</script>
</body>
</html>
