<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>上传和创作 · 智能剧本创作平台原型</title>
<link rel="stylesheet" href="css/app.css?v=7">
<style>
/* ---------- 上传和创作页专属样式 ---------- */
.cardbox { margin: 12px 16px; border: none; border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow-card); padding: 14px; }
.cardbox h3 { font-size: 14px; color: var(--text-1); margin-bottom: 6px; }
.uprow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--divider); cursor: pointer; }
.uprow:last-child { border-bottom: none; }
.uprow .ic { width: 40px; height: 40px; border-radius: 10px; background: var(--primary-tint); color: var(--primary); display: flex; align-items: center; justify-content: center; flex: none; }
.uprow .ic svg { width: 20px; height: 20px; }
.uprow .tt { flex: 1; min-width: 0; }
.uprow .tt b { font-size: 14px; color: var(--text-1); display: block; }
.uprow .tt p { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.uprow .ar { color: #C9CDD4; }
.qtip { font-size: 11px; color: var(--text-3); margin: 0 0 4px; }
</style>
</head>
<body data-tab="create">
<div class="app">

  <header class="appbar">
    <button class="icon-btn" onclick="openDrawer(true)" title="工具与设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <h1>上传和创作</h1>
    <span style="width:28px;flex:none"></span>
  </header>

  <main class="page-body">
    <!-- 上传区 -->
    <section class="cardbox">
      <h3>上传</h3>
      <div class="uprow" onclick="location.href='upload.html'">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5v4h4"/><path d="M12 17v-6M9.5 13.5L12 11l2.5 2.5"/></svg></span>
        <div class="tt"><b>剧本上传</b><p>投稿剧本作品，填写信息、上传封面与正文</p></div>
        <span class="ar">›</span>
      </div>
      <div class="uprow" onclick="go('comic_upload')">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M3.5 9.5h17M8 5v4.5M16 5v4.5"/><path d="M12 12v4M10 14h4"/></svg></span>
        <div class="tt"><b>漫剧上传</b><p>上传漫剧剧集与素材，进入发行流程</p></div>
        <span class="ar">›</span>
      </div>
    </section>

    <!-- 创作区 -->
    <section class="cardbox">
      <h3>创作</h3>
      <p class="qtip" id="hubQ"></p>
      <div class="uprow" onclick="location.href='script_create.html'">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4.5" cy="6" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="18" r=".8"/></svg></span>
        <div class="tt"><b>剧本大纲</b><p>AI 生成三幕大纲，支持添加风格标签</p></div>
        <span class="ar">›</span>
      </div>
      <div class="uprow" onclick="location.href='ai_write.html'">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 19.5l1-4L16.8 4.2a1.4 1.4 0 0 1 2 2L7.5 17.5z"/><path d="M14.8 6.2l2 2"/></svg></span>
        <div class="tt"><b>AI 写作</b><p>上传文档或大纲生成完整剧本，支持预览/下载/多轮改稿</p></div>
        <span class="ar">›</span>
      </div>
      <div class="uprow" onclick="location.href='polish.html'">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l1.6 3.6L17 9l-3.4 1.4L12 14l-1.6-3.6L7 9l3.4-1.4z"/><path d="M18 15l.9 2 2 .9-2 .9-.9 2-.9-2-2-.9 2-.9z"/></svg></span>
        <div class="tt"><b>辅助润色</b><p>多参数润色方向与强度，支持保留词、多版改稿与下载</p></div>
        <span class="ar">›</span>
      </div>
    </section>
  </main>

</div>
<script src="js/app.js?v=17"></script>
<script>
/* ---------- 剩余 AI 创作次数（福利 - 积分商店兑换） ---------- */
(function () {
  var q = getQuota();
  document.getElementById('hubQ').textContent = '剩余 AI 次数：大纲 ' + (q.outline || 0) + ' · 写作 ' + (q.write || 0) + ' · 润色 ' + (q.polish || 0) + '（可在福利 - 积分商店兑换）';
})();
</script>
</body>
</html>
