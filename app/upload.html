<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>剧本投稿 · 智能剧本创作平台原型</title>
<link rel="stylesheet" href="css/app.css?v=7">
<style>
/* ---------- 剧本投稿页专属样式 ---------- */
.cardbox { margin: 12px 16px; border: none; border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow-card); padding: 14px; }
.cardbox h3 { font-size: 14px; margin-bottom: 8px; color: var(--text-1); }
.rules li { list-style: none; font-size: 12px; color: var(--text-2); line-height: 2; padding-left: 14px; position: relative; }
.rules li::before { content: '·'; position: absolute; left: 2px; font-weight: 700; color: var(--text-3); }
.fld { margin-bottom: 10px; }
.fld label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
.fld input, .fld textarea, .fld select { width: 100%; border: 1px solid var(--divider); border-radius: 8px; padding: 8px 10px; font-size: 13px; background: var(--card); color: var(--text-1); font-family: inherit; outline: none; }
.fld input:focus, .fld textarea:focus, .fld select:focus { border-color: var(--primary); }
.fld select { height: 36px; }
.fld-row { display: flex; gap: 10px; }
.fld-row .fld { flex: 1; }
/* 自由标签 */
.tag-editor { border: 1px solid var(--divider); border-radius: 8px; padding: 8px; background: var(--card); }
.tag-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.tag-chips:empty { display: none; }
.tchip { display: inline-flex; align-items: center; gap: 5px; background: var(--primary-tint); color: var(--primary); border-radius: 12px; padding: 3px 10px; font-size: 12px; }
.tchip button { border: none; background: none; color: var(--primary); font-size: 14px; line-height: 1; cursor: pointer; padding: 0; opacity: .7; }
.tag-input-row { display: flex; gap: 8px; align-items: center; }
.tag-input-row input { flex: 1; border: none; outline: none; font-size: 13px; background: transparent; color: var(--text-1); height: 30px; }
.tag-add { flex: none; width: 64px; height: 30px; border-radius: 8px; font-size: 12px; }
/* 封面上传 */
.cover-box { position: relative; width: 132px; aspect-ratio: 3 / 4; border: 1.5px dashed #C9CDD4; border-radius: 10px; background: var(--fill); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--text-3); font-size: 12px; cursor: pointer; overflow: hidden; }
.cover-box .cover-plus { font-size: 26px; line-height: 1; }
.cover-box.on { border: none; background: linear-gradient(160deg, #EDF1F7, #DCE6F2); }
.cover-box.on .cover-plus, .cover-box.on .cover-tip { display: none; }
.cover-box .cover-title { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; padding: 10px; text-align: center; font-size: 15px; font-weight: 600; color: var(--primary); line-height: 1.5; }
.cover-box.on .cover-title { display: flex; }
.cover-ops { display: flex; gap: 8px; margin-top: 10px; width: 132px; }
.cover-ops .btn-outline { height: 32px; border-radius: 8px; font-size: 12px; }
.cover-ops .del { background: var(--fill); color: var(--text-3); }
.cover-hint { font-size: 11px; color: var(--text-3); margin-top: 8px; }
.file-box { border: 1.5px dashed #C9CDD4; border-radius: 10px; padding: 22px 12px; text-align: center; color: var(--text-3); font-size: 12px; cursor: pointer; background: var(--fill); }
.file-box.on { border-color: var(--primary); color: var(--primary); background: var(--primary-tint); font-weight: 600; }
/* 按集上传行 */
.eprow { display: flex; align-items: center; gap: 8px; padding: 9px 2px; border-bottom: 1px solid var(--divider); font-size: 12px; color: var(--text-1); }
.eprow .n { flex: none; width: 44px; color: var(--primary); font-weight: 600; }
.eprow .f { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
.eprow .sz { flex: none; color: var(--text-3); }
.eprow .del { flex: none; border: none; background: none; color: var(--text-3); font-size: 14px; cursor: pointer; padding: 0 2px; }
.fmts { display: flex; gap: 6px; margin-top: 8px; }
.fmts span { font-size: 10px; border: none; border-radius: 4px; padding: 2px 6px; color: var(--text-3); background: var(--fill); }
.form-foot { display: flex; gap: 12px; margin: 4px 16px 12px; }
/* 审核流程步骤条 */
.steps li { list-style: none; display: flex; gap: 10px; position: relative; padding-bottom: 18px; font-size: 13px; color: var(--text-3); }
.steps li::before { content: ''; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #C9CDD4; flex: none; margin-top: 2px; background: var(--card); }
.steps li::after { content: ''; position: absolute; left: 6.5px; top: 18px; bottom: 2px; width: 1.5px; background: var(--divider); }
.steps li:last-child::after { display: none; }
.steps li.done { color: var(--text-1); }
.steps li.done::before { background: var(--primary); border-color: var(--primary); }
.steps li.now { color: var(--primary); font-weight: 600; }
.steps li.now::before { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint); }
.flow-tip { font-size: 11px; color: var(--text-3); margin-top: 4px; }
/* 草稿箱弹层 */
.draft-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--divider); font-size: 13px; color: var(--text-1); }
.draft-item .ops button { border: none; background: none; font-size: 12px; color: var(--primary); cursor: pointer; margin-left: 10px; }
.draft-item .ops .del { color: var(--text-3); }
.empty-draft { font-size: 12px; color: var(--text-3); padding: 12px 0; }
</style>
</head>
<body data-tab="upload">
<div class="app">

  <header class="appbar">
    <button class="icon-btn" onclick="openDrawer(true)" title="工具与设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <h1>剧本上传</h1>
    <button class="sq-btn" onclick="openDrafts(true)">草稿箱</button>
  </header>

  <main class="page-body">
    <!-- 上传规范 -->
    <section class="cardbox">
      <h3>上传规范</h3>
      <ul class="rules">
        <li>平台仅收录试看部分，请勿上传完整剧本</li>
        <li>剧本按集上传，上传多少集读者就能看多少集</li>
        <li>每集支持 docx / txt / pdf / md 格式</li>
        <li>内容不涉黄、不涉政、不踩红线，须为原创首发并同步存证</li>
        <li>完整剧本可由买卖双方谈判签约后自行交割，不经平台</li>
      </ul>
    </section>

    <!-- 信息填写 -->
    <section class="cardbox">
      <h3>信息填写</h3>
      <div class="fld"><label>作品名称</label><input id="fTitle" placeholder="请输入剧本 / 小说名称"></div>
      <div class="fld-row">
        <div class="fld"><label>题材</label>
          <select id="fSub"><option>都市</option><option>古装</option><option>玄幻</option><option>言情</option><option>悬疑</option></select>
        </div>
        <div class="fld"><label>时长</label>
          <select id="fDur"><option>1-3分钟/集</option><option>3-5分钟/集</option><option>5-10分钟/集</option></select>
        </div>
      </div>
      <div class="fld-row">
        <div class="fld"><label>预期成本</label>
          <select id="fCost"><option>免费</option><option>1万以下</option><option>1万-5万</option><option>5万-10万</option></select>
        </div>
        <div class="fld"><label>标注价格（元）</label>
          <input id="fPrice" type="number" min="0" step="100" placeholder="0 为免费">
        </div>
      </div>
      <div class="fld-row">
        <div class="fld"><label>字数（万字）</label>
          <input id="fWords" type="number" min="0.1" step="0.1" placeholder="如：12.6">
        </div>
        <div class="fld"><label>剧本总集数</label>
          <input id="fEps" type="number" min="1" step="1" placeholder="如：24">
        </div>
      </div>
      <div class="fld"><label>情节（可多选，与题材一样用于分类）</label>
        <div class="chips" id="plotChips"></div>
      </div>
      <div class="fld"><label>标签</label>
        <div class="tag-editor">
          <div class="tag-chips" id="tagChips"></div>
          <div class="tag-input-row">
            <input id="fTag" placeholder="输入标签，回车或点添加">
            <button type="button" class="btn-outline tag-add" onclick="addTag()">添加</button>
          </div>
        </div>
      </div>
      <div class="fld"><label>作品简介</label><textarea id="fSyn" rows="3" placeholder="一句话讲清楚你的故事"></textarea></div>
    </section>

    <!-- 联系方式 -->
    <section class="cardbox">
      <h3>联系方式</h3>
      <div class="fld"><label>电话号码（必填）</label><input id="fPhone" type="tel" maxlength="11" placeholder="11 位手机号，供甲方线下签约联系"></div>
      <div class="fld-row">
        <div class="fld"><label>QQ（选填）</label><input id="fQQ" placeholder="QQ 号"></div>
        <div class="fld"><label>微信（选填）</label><input id="fWX" placeholder="微信号"></div>
      </div>
      <div class="fld" style="margin-bottom:0"><label>电子邮箱（选填）</label><input id="fEmail" type="email" placeholder="name@example.com"></div>
    </section>

    <!-- 封面 -->
    <section class="cardbox">
      <h3>封面</h3>
      <div class="cover-box" id="coverBox" onclick="pickCover()">
        <span class="cover-plus">+</span>
        <span class="cover-tip">点击上传封面</span>
        <span class="cover-title"></span>
      </div>
      <div class="cover-ops" id="coverOps" style="display:none">
        <button type="button" class="btn-outline" onclick="pickCover()">更换</button>
        <button type="button" class="btn-outline del" onclick="removeCover()">移除</button>
      </div>
      <p class="cover-hint">建议 3:4 竖版 · JPG / PNG · 不超过 5MB（模拟）</p>
    </section>

    <!-- 剧集上传（按集） -->
    <section class="cardbox">
      <h3>剧集上传（按集）</h3>
      <p class="cover-hint" style="margin:0 0 8px">一集一个文件 · 上传多少集，读者就能看多少集（模拟）</p>
      <div id="epList"></div>
      <div class="file-box" id="epAdd" onclick="addEp()">+ 点击上传第 1 集</div>
      <div class="fmts"><span>docx</span><span>txt</span><span>pdf</span><span>md</span></div>
    </section>

    <div class="form-foot">
      <button class="btn-outline" onclick="saveDraft()">存草稿</button>
      <button class="btn-solid" onclick="submit()">提交审核</button>
    </div>

    <!-- 审核流程 -->
    <section class="cardbox" id="flowBox" style="display:none">
      <h3>审核流程</h3>
      <ol class="steps" id="steps"></ol>
      <p class="flow-tip" id="flowTip"></p>
    </section>
  </main>

  <!-- 草稿箱弹层 -->
  <div class="sheet-mask" id="draftMask" onclick="openDrafts(false)"></div>
  <div class="sheet" id="draftSheet">
    <h3>草稿箱</h3>
    <div id="draftList"></div>
  </div>

</div>
<script src="js/app.js?v=17"></script>
<script>
/* ---------- 剧集上传（按集，模拟选文件） ---------- */
var EPS = [];
function addEp() {
  var total = parseInt(document.getElementById('fEps').value, 10) || 0;
  if (total > 0 && EPS.length >= total) { toast('已上传集数达到剧本总集数 ' + total); return; }
  if (EPS.length >= 99) { toast('最多上传 99 集'); return; }
  var fmts = ['docx', 'txt', 'pdf', 'md'];
  var fmt = fmts[Math.floor(Math.random() * fmts.length)];
  var name = document.getElementById('fTitle').value.trim() || '未命名作品';
  EPS.push({ f: '《' + name + '》第 ' + (EPS.length + 1) + ' 集.' + fmt, sz: (Math.random() * 1.2 + 0.2).toFixed(1) });
  renderEps();
  toast('第 ' + EPS.length + ' 集已上传，读者可看到第 ' + EPS.length + ' 集（模拟）');
}
function delEp(i) { EPS.splice(i, 1); renderEps(); }
function renderEps() {
  document.getElementById('epList').innerHTML = EPS.map(function (e, i) {
    return '<div class="eprow"><span class="n">第' + (i + 1) + '集</span><span class="f">' + e.f + '</span><span class="sz">' + e.sz + ' MB</span><button type="button" class="del" onclick="delEp(' + i + ')" title="删除">×</button></div>';
  }).join('');
  document.getElementById('epAdd').textContent = '+ 点击上传第 ' + (EPS.length + 1) + ' 集';
}

/* ---------- 情节多选（与题材一样用于分类） ---------- */
var PLOTS = ['悬疑', '反转', '复仇', '大女主', '甜宠', '虐恋', '群像', '权谋', '志异', '治愈'];
var plotSel = [];
function renderPlots() {
  document.getElementById('plotChips').innerHTML = PLOTS.map(function (v) {
    return '<button type="button" class="chip' + (plotSel.indexOf(v) > -1 ? ' on' : '') + '" onclick="togglePlot(\'' + v + '\')">' + v + '</button>';
  }).join('');
}
function togglePlot(v) {
  var i = plotSel.indexOf(v);
  if (i > -1) plotSel.splice(i, 1);
  else { if (plotSel.length >= 5) { toast('最多选择 5 个情节'); return; } plotSel.push(v); }
  renderPlots();
}

/* ---------- 封面上传（模拟） ---------- */
var curCover = '';
function pickCover() {
  var name = document.getElementById('fTitle').value.trim() || '未命名作品';
  curCover = name + '-cover.jpg';
  var box = document.getElementById('coverBox');
  box.classList.add('on');
  box.querySelector('.cover-title').textContent = name;
  document.getElementById('coverOps').style.display = 'flex';
  toast('封面已上传（模拟）');
}
function removeCover() {
  curCover = '';
  document.getElementById('coverBox').classList.remove('on');
  document.getElementById('coverOps').style.display = 'none';
  toast('封面已移除');
}

/* ---------- 自由标签 ---------- */
var TAGS = [];
function renderTags() {
  document.getElementById('tagChips').innerHTML = TAGS.map(function (t, i) {
    return '<span class="tchip">' + t + '<button type="button" onclick="delTag(' + i + ')" title="移除标签">×</button></span>';
  }).join('');
}
function addTag() {
  var box = document.getElementById('fTag');
  var v = box.value.trim();
  if (!v) { toast('请输入标签内容'); return; }
  if (TAGS.indexOf(v) > -1) { toast('该标签已添加'); return; }
  if (TAGS.length >= 8) { toast('最多添加 8 个标签'); return; }
  TAGS.push(v);
  box.value = '';
  renderTags();
}
function delTag(i) { TAGS.splice(i, 1); renderTags(); }

/* ---------- 草稿箱 ---------- */
var DKEY = 'up_drafts';
function getD() { try { return JSON.parse(localStorage.getItem(DKEY)) || []; } catch (e) { return []; } }
function saveDraft() {
  var d = collect();
  if (!d.title && !d.syn && !EPS.length) { toast('先填写内容再存草稿'); return; }
  var list = getD();
  d.ts = Date.now();
  d.epsList = EPS.slice();
  list.unshift(d);
  localStorage.setItem(DKEY, JSON.stringify(list.slice(0, 10)));
  renderDrafts();
  toast('已存入草稿箱');
}
function collect() {
  return {
    title: document.getElementById('fTitle').value.trim(),
    sub: document.getElementById('fSub').value,
    dur: document.getElementById('fDur').value,
    cost: document.getElementById('fCost').value,
    price: parseInt(document.getElementById('fPrice').value, 10) || 0,
    words: parseFloat(document.getElementById('fWords').value) || 0,
    eps: parseInt(document.getElementById('fEps').value, 10) || 0,
    plots: plotSel.slice(),
    phone: document.getElementById('fPhone').value.trim(),
    qq: document.getElementById('fQQ').value.trim(),
    wx: document.getElementById('fWX').value.trim(),
    em: document.getElementById('fEmail').value.trim(),
    syn: document.getElementById('fSyn').value.trim(),
    tags: TAGS.slice(),
    cover: curCover
  };
}
function renderDrafts() {
  var list = getD();
  document.getElementById('draftList').innerHTML = list.length
    ? list.map(function (d, i) {
        return '<div class="draft-item"><span>' + (d.title || '未命名作品') + '</span>' +
          '<span class="ops"><button onclick="restoreDraft(' + i + ')">恢复</button>' +
          '<button class="del" onclick="delDraft(' + i + ')">删除</button></span></div>';
      }).join('')
    : '<p class="empty-draft">草稿箱是空的</p>';
}
function restoreDraft(i) {
  var d = getD()[i];
  document.getElementById('fTitle').value = d.title || '';
  document.getElementById('fSub').value = d.sub || '都市';
  document.getElementById('fDur').value = d.dur || '1-3分钟/集';
  document.getElementById('fCost').value = d.cost || '免费';
  document.getElementById('fPrice').value = (d.price === undefined || d.price === null) ? '' : d.price;
  document.getElementById('fWords').value = d.words ? d.words : '';
  document.getElementById('fEps').value = (d.eps === undefined || d.eps === null) ? '' : d.eps;
  document.getElementById('fPhone').value = d.phone || '';
  document.getElementById('fQQ').value = d.qq || '';
  document.getElementById('fWX').value = d.wx || '';
  document.getElementById('fEmail').value = d.em || '';
  document.getElementById('fSyn').value = d.syn || '';
  TAGS = (d.tags || []).slice();
  renderTags();
  plotSel = (d.plots || []).slice();
  renderPlots();
  curCover = d.cover || '';
  var cbox = document.getElementById('coverBox');
  if (curCover) { cbox.classList.add('on'); cbox.querySelector('.cover-title').textContent = d.title || '未命名作品'; document.getElementById('coverOps').style.display = 'flex'; }
  else { cbox.classList.remove('on'); document.getElementById('coverOps').style.display = 'none'; }
  EPS = (d.epsList || []).slice();
  renderEps();
  openDrafts(false);
  toast('草稿已恢复');
}
function delDraft(i) {
  var list = getD();
  list.splice(i, 1);
  localStorage.setItem(DKEY, JSON.stringify(list));
  renderDrafts();
  toast('草稿已删除');
}
function openDrafts(open) {
  document.getElementById('draftSheet').classList.toggle('show', open);
  document.getElementById('draftMask').classList.toggle('show', open);
}

/* ---------- 提交与审核流程 ---------- */
var FLOW = ['提交成功', '平台 AI 初筛', '版权中心审核', '上架交易大厅'];
var FKEY = 'up_flow';
function getFlow() { try { return JSON.parse(localStorage.getItem(FKEY)); } catch (e) { return null; } }
function renderFlow() {
  var r = getFlow();
  var box = document.getElementById('flowBox');
  if (!r) { box.style.display = 'none'; return; }
  box.style.display = '';
  document.getElementById('steps').innerHTML = FLOW.map(function (s, i) {
    var cls = i < r.done ? 'done' : (i === r.done ? 'now' : '');
    return '<li class="' + cls + '">' + s + (i === r.done ? '（进行中）' : '') + '</li>';
  }).join('');
  document.getElementById('flowTip').textContent = '《' + r.title + '》当前进度：' + FLOW[r.done] + '，预计 1-3 个工作日';
}
function submit() {
  var d = collect();
  if (!d.title) { toast('请填写作品名称'); return; }
  var pv = document.getElementById('fPrice').value.trim();
  if (pv === '' || isNaN(parseInt(pv, 10)) || parseInt(pv, 10) < 0) { toast('请填写标注价格（0 表示免费）'); return; }
  if (!/^1\d{10}$/.test(d.phone)) { toast('请填写正确的 11 位手机号码'); return; }
  if (!(d.words > 0)) { toast('请填写字数'); return; }
  if (!(d.eps > 0)) { toast('请填写剧本总集数'); return; }
  if (!plotSel.length) { toast('请至少选择一个情节，用于分类'); return; }
  if (!EPS.length) { toast('请至少上传 1 集试看内容'); return; }
  if (EPS.length > d.eps) { toast('已上传集数不能大于剧本总集数'); return; }
  var r = { title: d.title, done: 1, ts: Date.now() };
  localStorage.setItem(FKEY, JSON.stringify(r));
  renderFlow();
  document.getElementById('flowBox').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  toast('提交成功，已上传 ' + EPS.length + ' 集，读者可试看 ' + EPS.length + ' 集，进入审核流程');
  setTimeout(function () {
    r.done = 2;
    localStorage.setItem(FKEY, JSON.stringify(r));
    renderFlow();
    toast('AI 初筛通过，已送版权中心审核');
  }, 4000);
}

document.getElementById('fTag').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addTag(); } });
renderTags();
renderPlots();
renderEps();
renderDrafts();
renderFlow();
</script>
</body>
</html>
