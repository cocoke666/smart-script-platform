<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>漫剧 · 智能剧本创作平台原型</title>
<link rel="stylesheet" href="css/app.css?v=7">
<style>
/* ---------- 漫剧页专属样式 ---------- */
.appbar.dark { background: rgba(20, 20, 20, .88); border-bottom-color: #000; }
.appbar.dark .icon-btn { color: var(--text-2); }
.history { position: absolute; top: 56px; left: 12px; right: 12px; margin: 0; z-index: 15; }
/* 竖滑视频流 */
.feed { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; background: #111; scrollbar-width: none; -ms-overflow-style: none; }
.feed::-webkit-scrollbar { display: none; }
.feed-item { position: relative; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; overflow: hidden; }
.video-box { position: absolute; inset: 0; background: #1a1a1a; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.video-box .tip { position: absolute; top: 14px; left: 0; right: 0; text-align: center; color: #555; font-size: 12px; }
.play-badge { width: 64px; height: 64px; border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; opacity: .85; transition: .3s; }
.play-badge svg { width: 26px; height: 26px; margin-left: 4px; }
.feed-item.playing .play-badge { opacity: 0; }
.progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, .25); }
.progress i { display: block; height: 100%; width: 0; background: #fff; }
.feed-item.playing .progress i { animation: prog 20s linear forwards; }
@keyframes prog { from { width: 0; } to { width: 100%; } }
.feed-info { position: relative; padding: 40px 92px 16px 14px; background: linear-gradient(transparent, rgba(0, 0, 0, .78)); }
.feed-info h3 { font-size: 16px; margin-bottom: 4px; }
.feed-info p { font-size: 12px; color: #bbb; }
.rail { position: absolute; right: 10px; bottom: 96px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.rail button { border: none; background: none; color: #fff; border-radius: 14px; padding: 8px 11px; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.rail svg { width: 21px; height: 21px; }
/* 信息流广告卡片 */
.feed-item.ad { align-items: center; justify-content: center; gap: 14px; background: #222; }
.ad-badge { position: absolute; top: 12px; right: 12px; font-size: 10px; border: 1px solid #fff; color: #fff; border-radius: 4px; padding: 1px 6px; }
.ad-creative { width: 74%; aspect-ratio: 16 / 9; border: 1.5px dashed #888; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #999; font-size: 13px; text-align: center; line-height: 1.9; }
.feed-item.ad .btn-solid { flex: none; width: 60%; }
.ad-tip { font-size: 11px; color: #888; }
/* 开屏广告 */
.splash { position: absolute; inset: 0; z-index: 80; background: #000; display: flex; align-items: center; justify-content: center; }
.splash.hide { display: none; }
.splash-creative { width: 78%; max-height: 70%; aspect-ratio: 9 / 16; border: 1.5px dashed #666; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #888; font-size: 13px; text-align: center; line-height: 2; }
.splash-skip { position: absolute; top: 14px; right: 14px; border: 1px solid #888; background: rgba(0, 0, 0, .5); color: #ddd; border-radius: 14px; padding: 4px 12px; font-size: 12px; cursor: pointer; }
/* 评论面板 */
.cmt-list { max-height: 45vh; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
.cmt-list::-webkit-scrollbar { display: none; }
.cmt { display: flex; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--divider); }
.cmt:last-child { border-bottom: none; }
.cmt .ava { width: 30px; height: 30px; border-radius: 50%; background: var(--primary-tint); color: var(--primary); flex: none; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }
.cmt .body { flex: 1; }
.cmt .nick { font-size: 12px; color: var(--text-3); margin-bottom: 2px; }
.cmt .text { font-size: 13px; color: var(--text-1); }
.cmt .meta { font-size: 10px; color: var(--text-3); margin-top: 3px; display: flex; gap: 12px; }
.cmt .meta span:last-child { cursor: pointer; }
.cmt-bar { display: flex; gap: 8px; margin-top: 10px; }
.cmt-bar input { flex: 1; height: 36px; border: none; background: var(--fill); color: var(--text-1); border-radius: 18px; padding: 0 14px; font-size: 13px; outline: none; }
</style>
</head>
<body data-tab="comic">
<div class="app">

  <!-- 开屏广告 -->
  <div class="splash" id="splash">
    <div class="splash-creative">开屏广告位（模拟）<br>穿山甲 / 百度联盟 / 腾讯广告联盟</div>
    <button class="splash-skip" id="splashSkip" onclick="closeSplash()">跳过 3s</button>
  </div>

  <header class="appbar dark">
    <div class="search-input">
      <button class="icon-btn" onclick="openDrawer(true)" title="工具与设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <input id="q" placeholder="搜索漫剧" enterkeyhint="search">
    </div>
  </header>

  <!-- 搜索历史（悬浮于视频流之上） -->
  <div class="history" id="history">
    <div class="history-head"><span>搜索历史</span><button onclick="clearHistory()">清空</button></div>
    <div class="chips" id="historyChips"></div>
  </div>

  <!-- 滑动播放：视频 + 信息流广告 -->
  <main class="feed" id="feed"></main>

  <!-- 评论面板 -->
  <div class="sheet-mask" id="cmtMask" onclick="closeCmt()"></div>
  <div class="sheet" id="cmtSheet">
    <h3 id="cmtTitle">评论</h3>
    <div class="cmt-list" id="cmtList"></div>
    <div class="cmt-bar">
      <input id="cmtInput" placeholder="说点什么…" enterkeyhint="send">
      <button class="btn-solid" style="flex:none;width:72px" onclick="sendCmt()">发送</button>
    </div>
  </div>

</div>
<script src="js/app.js?v=17"></script>
<script>
/* ---------- 模拟数据：视频与信息流广告混排 ---------- */
var FEED = [
  { t: '《长风渡我》第 1 集', m: '都市 · 3-5分钟/集 · 播放 12.4万', like: '1.2万', fav: '3231', c: '486' },
  { t: '《长风渡我》第 2 集', m: '都市 · 3-5分钟/集 · 播放 9.8万',  like: '9896', fav: '2710', c: '352' },
  { ad: true },
  { t: '《春日宴迟》第 3 集', m: '言情 · 3-5分钟/集 · 播放 8.9万',  like: '8642', fav: '1988', c: '279' },
  { t: '《山海拾遗》第 1 集', m: '玄幻 · 1-3分钟/集 · 播放 3.1万',  like: '3120', fav: '876',  c: '143' },
  { t: '《夜航船记》第 1 集', m: '悬疑 · 5-10分钟/集 · 播放 5.6万', like: '5477', fav: '1420', c: '198' }
];

/* ---------- 线性图标 ---------- */
function ico(p) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>'; }
var IC = {
  heart: ico('<path d="M12 20.2s-7.6-4.8-9.3-9.2A4.9 4.9 0 0 1 12 6.9a4.9 4.9 0 0 1 9.3 4.1c-1.7 4.4-9.3 9.2-9.3 9.2z"/>'),
  star:  ico('<path d="M12 4.2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.6-4.8 2.6.9-5.4-3.9-3.8 5.4-.8z"/>'),
  cmt:   ico('<path d="M4.5 5.5h15V16h-9l-6 4.5z"/>'),
  share: ico('<path d="M12 15.5V4M8.2 7.6L12 3.8l3.8 3.8M5.5 13.5v6h13v-6"/>'),
  play:  '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8.5 5.5l11 6.5-11 6.5z"/></svg>'
};

function feedHTML() {
  /* 支持分类页带参跳转：?sub=题材，按信息流元信息首段过滤 */
  var pm = location.search.match(/[?&]sub=([^&]*)/);
  var sub = pm ? decodeURIComponent(pm[1]) : '';
  var out = [];
  FEED.forEach(function (it, idx) {
    if (it.ad) {
      out.push('<section class="feed-item ad">' +
        '<span class="ad-badge">广告</span>' +
        '<div class="ad-creative">信息流广告位（模拟）<br>观看完整视频可得奖励</div>' +
        '<button class="btn-solid" onclick="toast(\'原型演示：跳转广告落地页\')">立即下载</button>' +
        '<p class="ad-tip">激励广告 · 点击可领 +50 积分</p></section>');
      return;
    }
    if (sub && it.m.indexOf(sub) !== 0) return;
    out.push('<section class="feed-item">' +
      '<div class="video-box" onclick="togglePlay(this)">' +
        '<span class="tip">视频区域（模拟播放）</span>' +
        '<div class="play-badge">' + IC.play + '</div>' +
        '<div class="progress"><i></i></div>' +
      '</div>' +
      '<div class="feed-info"><h3>' + it.t + '</h3><p>' + it.m + '</p></div>' +
      '<div class="rail">' +
        '<button onclick="toast(\'原型演示：已点赞\')">' + IC.heart + '<span>' + it.like + '</span></button>' +
        '<button onclick="openCmt(' + idx + ')">' + IC.cmt + '<span>' + it.c + '</span></button>' +
        '<button onclick="toast(\'原型演示：已收藏\')">' + IC.star + '<span>' + it.fav + '</span></button>' +
        '<button onclick="toast(\'原型演示：已分享\')">' + IC.share + '<span>分享</span></button>' +
      '</div></section>');
  });
  return out.length ? out.join('') : '<p style="color:rgba(255,255,255,.55);font-size:13px;text-align:center;padding:80px 0">该分类下暂无漫剧，去其他分类看看</p>';
}
document.getElementById('feed').innerHTML = feedHTML();

/* ---------- 滑动播放：当前屏自动播放，其余暂停 ---------- */
function togglePlay(box) {
  box.closest('.feed-item').classList.toggle('playing');
}
var io = new IntersectionObserver(function (entries) {
  entries.forEach(function (en) {
    if (en.isIntersecting && en.intersectionRatio >= 0.6) {
      document.querySelectorAll('.feed-item.playing').forEach(function (x) {
        if (x !== en.target) x.classList.remove('playing');
      });
      if (!en.target.classList.contains('ad')) en.target.classList.add('playing');
    }
  });
}, { threshold: [0.6] });
document.querySelectorAll('.feed-item').forEach(function (x) { io.observe(x); });

/* ---------- 开屏广告：3 秒倒计时可跳过 ---------- */
var splashLeft = 3;
var splashTimer = setInterval(function () {
  splashLeft--;
  if (splashLeft <= 0) closeSplash();
  else document.getElementById('splashSkip').textContent = '跳过 ' + splashLeft + 's';
}, 1000);
function closeSplash() {
  clearInterval(splashTimer);
  document.getElementById('splash').classList.add('hide');
}

/* ---------- 搜索与搜索历史 ---------- */
var HKEY = 'cm_history';
function getH() { try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch (e) { return []; } }
function renderHistory() {
  var h = getH();
  document.getElementById('historyChips').innerHTML = h.length
    ? h.map(function (v) { return '<button class="chip" onclick="searchFromHistory(\'' + v + '\')">' + v + '</button>'; }).join('')
    : '<span class="none">暂无搜索历史</span>';
}
function pushHistory(v) {
  var h = getH().filter(function (x) { return x !== v; });
  h.unshift(v);
  localStorage.setItem(HKEY, JSON.stringify(h.slice(0, 8)));
  renderHistory();
}
function clearHistory() {
  localStorage.removeItem(HKEY);
  renderHistory();
  toast('搜索历史已清空');
}
function doSearch(v) {
  v = (v || '').trim();
  if (!v) { toast('请输入搜索关键词'); return; }
  pushHistory(v);
  showHistory(false);
  document.getElementById('q').blur();
  toast('原型演示：搜索「' + v + '」的漫剧结果');
}
function searchFromHistory(v) {
  document.getElementById('q').value = v;
  doSearch(v);
}
function showHistory(show) {
  document.getElementById('history').classList.toggle('show', show);
}
var input = document.getElementById('q');
var hideTimer = null;
input.addEventListener('focus', function () { clearTimeout(hideTimer); if (!input.value) showHistory(true); });
input.addEventListener('blur', function () { clearTimeout(hideTimer); hideTimer = setTimeout(function () { showHistory(false); }, 180); });
input.addEventListener('input', function () { showHistory(!input.value); });
input.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(input.value); });

renderHistory();

/* ---------- 评论面板 ---------- */
var CMT_POOL = [
  { n: '剧迷小鱼',   t: '节奏太棒了，一口气看完！' },
  { n: '编剧强迫症', t: '这集结尾的反转绝了。' },
  { n: '路人甲',     t: '求更新下一集，在线等。' },
  { n: '短剧重度户', t: '主演演技在线，追了追了。' },
  { n: '弹幕体质',   t: '求 BGM 名字，太贴了。' }
];
var cmtCur = 0;
function cmtListOf(idx) {
  var it = FEED[idx];
  if (!it.list) {
    it.list = [0, 1, 2].map(function (k) {
      var p = CMT_POOL[(idx + k) % CMT_POOL.length];
      return { n: p.n, t: p.t, m: '0' + (k + 1) + ':' + (10 + k * 7) };
    });
  }
  return it.list;
}
function openCmt(idx) {
  cmtCur = idx;
  renderCmt();
  document.getElementById('cmtSheet').classList.add('show');
  document.getElementById('cmtMask').classList.add('show');
}
function closeCmt() {
  document.getElementById('cmtSheet').classList.remove('show');
  document.getElementById('cmtMask').classList.remove('show');
}
function renderCmt() {
  var list = cmtListOf(cmtCur);
  document.getElementById('cmtTitle').textContent = '评论 ' + list.length;
  document.getElementById('cmtList').innerHTML = list.map(function (c) {
    return '<div class="cmt"><div class="ava">' + c.n.slice(0, 1) + '</div><div class="body">' +
      '<div class="nick">' + c.n + '</div><div class="text">' + c.t + '</div>' +
      '<div class="meta"><span>' + c.m + '</span><span onclick="toast(\'原型演示：已赞评论\')">♡ 赞</span></div>' +
      '</div></div>';
  }).join('');
}
function sendCmt() {
  var box = document.getElementById('cmtInput');
  var v = box.value.trim();
  if (!v) { toast('请输入评论内容'); return; }
  cmtListOf(cmtCur).push({ n: '我', t: v, m: '刚刚' });
  box.value = '';
  renderCmt();
  toast('评论已发布');
}
document.getElementById('cmtInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') sendCmt(); });
</script>
</body>
</html>
