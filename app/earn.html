<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>福利 · 智能剧本创作平台原型</title>
<link rel="stylesheet" href="css/app.css?v=7">
<style>
/* ---------- 福利页专属样式 ---------- */
.cardbox { margin: 12px 16px; border: none; border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow-card); padding: 14px; }
.cardbox h3 { font-size: 14px; margin-bottom: 8px; color: var(--text-1); }
.points-card { margin: 12px 16px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border-radius: var(--radius); padding: 18px 8px; display: flex; text-align: center; box-shadow: var(--shadow-card); }
.points-card > div { flex: 1; }
.points-card b { display: block; font-size: 20px; margin-bottom: 4px; font-weight: 600; }
.points-card span { font-size: 11px; color: rgba(255, 255, 255, .72); }
.task { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--divider); }
.task:last-child { border-bottom: none; }
.task h4 { font-size: 14px; margin-bottom: 2px; color: var(--text-1); font-weight: 500; }
.task p { font-size: 12px; color: var(--text-3); }
.task .btn-solid { flex: none; width: 76px; height: 30px; border-radius: 15px; font-size: 12px; }
.task .btn-solid.done { background: var(--fill); color: var(--text-3); }
.rec { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); padding: 8px 0; border-bottom: 1px dashed var(--divider); }
.rec:last-child { border-bottom: none; }
.rec .plus { color: var(--primary); font-weight: 600; }
.rec .plus.minus { color: var(--error); }
.task h4 em { font-style: normal; color: var(--primary); font-size: 11px; margin-left: 6px; }
.empty-rec { font-size: 12px; color: var(--text-3); padding: 8px 0; }
/* 激励视频广告遮罩 */
.reward { position: absolute; inset: 0; z-index: 80; background: rgba(17, 20, 26, .94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #fff; }
.reward.hide { display: none; }
.reward-creative { width: 74%; aspect-ratio: 16 / 9; border: 1.5px dashed rgba(255, 255, 255, .28); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: rgba(255, 255, 255, .5); font-size: 13px; text-align: center; line-height: 1.9; }
.reward-skip { position: absolute; top: 14px; right: 14px; border: 1px solid rgba(255, 255, 255, .3); background: rgba(255, 255, 255, .12); color: #fff; border-radius: 14px; padding: 4px 12px; font-size: 12px; cursor: pointer; }
.reward-tip { font-size: 12px; color: rgba(255, 255, 255, .6); }
</style>
</head>
<body data-tab="profile">
<div class="app">

  <header class="appbar">
    <button class="icon-btn" onclick="openDrawer(true)" title="工具与设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <h1>福利</h1>
    <button class="sq-btn" onclick="toast('原型演示：积分规则说明')">规则</button>
  </header>

  <main class="page-body">
    <!-- 积分展示 -->
    <div class="points-card">
      <div><b id="statPts">0</b><span>我的积分</span></div>
      <div><b id="statToday">+0</b><span>今日积分</span></div>
    </div>

    <!-- 任务中心 -->
    <section class="cardbox">
      <h3>任务中心</h3>
      <div id="taskList"></div>
    </section>

    <!-- 积分商店 -->
    <section class="cardbox">
      <h3>积分商店</h3>
      <div id="shopList"></div>
    </section>

    <!-- 积分明细 -->
    <section class="cardbox">
      <h3>积分明细</h3>
      <div id="recList"></div>
    </section>
  </main>

  <!-- 激励视频广告（模拟） -->
  <div class="reward hide" id="reward">
    <div class="reward-creative">激励视频广告位（模拟）<br>看完即得 +50 积分</div>
    <p class="reward-tip" id="rewardTip">观看完整视频方可领取奖励</p>
    <button class="reward-skip" id="rewardSkip">3s</button>
  </div>

</div>
<script src="js/app.js?v=17"></script>
<script>
/* ---------- 积分与积分明细 ---------- */
var PKEY = 'earn_pts', RKEY = 'earn_recs', DKEY = 'earn_done';
function today() { return new Date().toISOString().slice(0, 10); }
function getPts() { return parseInt(localStorage.getItem(PKEY) || '1280', 10); }
function getRecs() { try { return JSON.parse(localStorage.getItem(RKEY)) || []; } catch (e) { return []; } }
function getDone() {
  var d = JSON.parse(localStorage.getItem(DKEY) || 'null');
  if (!d || d.date !== today()) d = { date: today(), ids: [] };
  return d;
}
function grant(pts, label) {
  localStorage.setItem(PKEY, String(getPts() + pts));
  var recs = getRecs();
  var t = new Date();
  recs.unshift({ ts: today() + ' ' + ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2), label: label, pts: pts });
  localStorage.setItem(RKEY, JSON.stringify(recs.slice(0, 20)));
  renderStats();
  renderRecs();
  toast('+' + pts + ' 积分已到账');
}
function renderStats() {
  document.getElementById('statPts').textContent = getPts();
  var t = getRecs().filter(function (r) { return r.ts.slice(0, 10) === today(); });
  document.getElementById('statToday').textContent = '+' + t.reduce(function (s, r) { return s + r.pts; }, 0);
}
function renderRecs() {
  var recs = getRecs();
  document.getElementById('recList').innerHTML = recs.length
    ? recs.slice(0, 6).map(function (r) {
        return '<div class="rec"><span>' + r.ts + ' · ' + r.label + '</span><span class="plus' + (r.pts < 0 ? ' minus' : '') + '">' + (r.pts > 0 ? '+' : '') + r.pts + '</span></div>';
      }).join('')
    : '<p class="empty-rec">暂无积分记录，先去做个任务吧</p>';
}

/* ---------- 积分商店：兑换 AI 辅助创作次数 ---------- */
var SHOP = [
  { id: 'outline', t: 'AI 大纲生成', d: '1 次 · 可在「创作 - 剧本大纲」使用', pts: 100 },
  { id: 'write',   t: 'AI 剧本写作', d: '1 次 · 可在「创作 - AI 写作」使用',   pts: 80 },
  { id: 'polish',  t: '辅助润色',     d: '1 次 · 可在「创作 - 辅助润色」使用', pts: 50 }
];
function renderShop() {
  var q = getQuota();
  document.getElementById('shopList').innerHTML = SHOP.map(function (s) {
    return '<div class="task"><div><h4>' + s.t + '<em>持有 ' + (q[s.id] || 0) + ' 次</em></h4><p>' + s.d + '</p></div>' +
      '<button class="btn-solid" onclick="buyQuota(\'' + s.id + '\')">' + s.pts + ' 积分兑换</button></div>';
  }).join('');
}
function buyQuota(id) {
  var s = SHOP.filter(function (x) { return x.id === id; })[0];
  if (getPts() < s.pts) { toast('积分不足，先去做任务赚积分吧'); return; }
  localStorage.setItem(PKEY, String(getPts() - s.pts));
  addQuota(id, 1);
  var recs = getRecs();
  var t = new Date();
  recs.unshift({ ts: today() + ' ' + ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2), label: '兑换' + s.t + ' 1 次', pts: -s.pts });
  localStorage.setItem(RKEY, JSON.stringify(recs.slice(0, 20)));
  renderStats(); renderRecs(); renderShop();
  toast('兑换成功，' + s.t + ' +1 次，去创作页使用吧');
}

/* ---------- 任务中心 ---------- */
var TASKS = [
  { id: 'sign',   t: '每日签到',       d: '+10 积分',       once: true  },
  { id: 'video',  t: '观看激励视频',   d: '+50 积分 / 次',  once: false },
  { id: 'watch',  t: '浏览漫剧 10 分钟', d: '+30 积分',      once: true  },
  { id: 'share',  t: '分享作品到朋友圈', d: '+20 积分',      once: true  },
  { id: 'invite', t: '邀请新用户',     d: '+200 积分',      once: true  }
];
function isDone(id) { return getDone().ids.indexOf(id) > -1; }
function markDone(id) {
  var d = getDone();
  d.ids.push(id);
  localStorage.setItem(DKEY, JSON.stringify(d));
}
function renderTasks() {
  document.getElementById('taskList').innerHTML = TASKS.map(function (k) {
    var done = k.once && isDone(k.id);
    return '<div class="task"><div><h4>' + k.t + '</h4><p>' + k.d + '</p></div>' +
      '<button class="btn-solid' + (done ? ' done' : '') + '" onclick="runTask(\'' + k.id + '\')">' +
      (done ? '已完成' : '去完成') + '</button></div>';
  }).join('');
}
function runTask(id) {
  if (id === 'sign') {
    if (isDone('sign')) { toast('今天已经签过到啦'); return; }
    markDone('sign'); grant(10, '每日签到'); renderTasks();
  } else if (id === 'video') {
    watchAd();
  } else if (id === 'watch') {
    if (isDone('watch')) { toast('今日浏览任务已完成'); return; }
    markDone('watch'); grant(30, '浏览漫剧 10 分钟'); renderTasks();
  } else if (id === 'share') {
    if (isDone('share')) { toast('今日分享任务已完成'); return; }
    markDone('share'); grant(20, '分享作品'); renderTasks();
  } else if (id === 'invite') {
    if (isDone('invite')) { toast('邀请奖励已领取'); return; }
    markDone('invite'); grant(200, '邀请新用户'); renderTasks();
  }
}

/* ---------- 激励视频：3 秒模拟播放后发奖 ---------- */
var rewardTimer = null;
function watchAd() {
  var left = 3;
  var box = document.getElementById('reward');
  var skip = document.getElementById('rewardSkip');
  box.classList.remove('hide');
  skip.textContent = left + 's';
  skip.onclick = function () { closeReward(false); };
  rewardTimer = setInterval(function () {
    left--;
    if (left <= 0) closeReward(true);
    else skip.textContent = left + 's';
  }, 1000);
}
function closeReward(finished) {
  clearInterval(rewardTimer);
  document.getElementById('reward').classList.add('hide');
  if (finished) grant(50, '观看激励视频');
  else toast('未看完广告，无奖励');
}

renderStats();
renderRecs();
renderTasks();
renderShop();
</script>
</body>
</html>
