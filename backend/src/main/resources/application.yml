server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: auth-server
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:script_platform}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    # 表结构由 db/schema.sql 管理；运行时只校验映射与表结构是否一致，避免自动改表
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    default-property-inclusion: always
    time-zone: Asia/Shanghai

auth:
  jwt:
    # 必须由环境变量提供，长度 >= 32 字节（HS256 要求 256 bit）；缺失则启动失败
    secret: ${JWT_SECRET:}
    issuer: script-platform
    access-token-ttl: 2h
    refresh-token-ttl: 30d
  sms:
    provider: ${SMS_PROVIDER:mock}
    code-length: 6
    code-ttl: 5m
    send-cooldown: 60s
    max-verify-attempts: 5
    phone-daily-limit: 10
    ip-hourly-limit: 30
  agreement:
    user-agreement-version: "1.0"
    privacy-policy-version: "1.0"
  cors:
    # 浏览器端联调来源（flutter run -d chrome / H5 原型）；生产用 CORS_ALLOWED_ORIGINS 收敛为具体域名
    allowed-origin-patterns: "${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}"

logging:
  level:
    root: info
    com.scriptplatform: info
